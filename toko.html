<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Koin Tupai - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-korisu { background-color: var(--korisu-orange); border-bottom: 3px solid var(--korisu-black);}
        .card-custom {
            background-color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--korisu-black);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card-custom:hover { transform: translateY(-5px); }
        .btn-beli {
            background-color: var(--korisu-black);
            color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            font-weight: bold;
        }
        .btn-beli:hover {
            background-color: var(--korisu-orange);
            color: var(--korisu-black);
        }
        .coin-badge {
            background-color: #ffc107;
            color: #000;
            font-size: 1.1rem;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid var(--korisu-black);
            font-weight: bold;
        }
        .item-icon {
            font-size: 4rem;
            text-align: center;
            margin: 15px 0;
        }
        .badge-tipe {
            position: absolute;
            top: 10px;
            right: 10px;
            border: 2px solid var(--korisu-black);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-korisu shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🏪 Toko Koin Tupai</a>
            <div class="d-flex align-items-center flex-wrap gap-2">
                <span class="coin-badge" id="dompet-header">🪙 Memuat...</span>
                <button class="btn btn-sm btn-light border-dark fw-bold" onclick="kembali()">Kembali</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Manjakan Maskot Tupaimu!</h2>
            <p class="text-muted">Gunakan Koin Tupai yang kamu kumpulkan untuk membeli item dan makanan.</p>
        </div>

        <div class="row" id="etalase-toko">
            <!-- Barang dari database akan dimunculkan di sini -->
            <div class="col-12 text-center" id="loading-text">
                <h5 class="fw-bold text-muted">Menyiapkan etalase...</h5>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        let USER = JSON.parse(localStorage.getItem('korisu_user') || '{}');

        if (!TOKEN) window.location.href = "auth.html";

        // Pasang saldo koin saat ini
        document.getElementById('dompet-header').innerText = `🪙 ${USER.koin || 0} Koin`;

        function kembali() { window.location.href = "dashboard.html"; }

        // Ambil barang dari server
        async function muatToko() {
            try {
                const res = await fetch(`${API_URL}/shop/items`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();
                
                const etalase = document.getElementById('etalase-toko');
                etalase.innerHTML = ""; // Bersihkan loading text
                
                if (res.ok && data.items.length > 0) {
                    data.items.forEach(item => {
                        // Tentukan warna badge berdasarkan tipe
                        const badgeColor = item.tipe_item === 'makanan' ? 'bg-success' : 'bg-primary';
                        
                        etalase.innerHTML += `
                            <div class="col-md-4 col-lg-3 mb-4">
                                <div class="card card-custom p-3 h-100 position-relative">
                                    <span class="badge ${badgeColor} badge-tipe text-uppercase">${item.tipe_item}</span>
                                    <div class="item-icon">${item.image_url}</div>
                                    <h5 class="fw-bold text-center mt-2">${item.nama_item}</h5>
                                    <h4 class="fw-bold text-danger text-center mb-3 mt-auto">🪙 ${item.harga_koin}</h4>
                                    <button class="btn btn-beli w-100" onclick="beliBarang(${item.id}, ${item.harga_koin}, '${item.nama_item}')">BELI</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    etalase.innerHTML = "<h5 class='text-center text-muted'>Toko sedang kosong hari ini.</h5>";
                }
            } catch (error) {
                console.error("Gagal memuat etalase.");
                document.getElementById('etalase-toko').innerHTML = "<h5 class='text-center text-danger'>Gagal terhubung ke toko.</h5>";
            }
        }

        // Proses Pembelian
        async function beliBarang(id, harga, nama) {
            if (confirm(`Tukar ${harga} koin untuk membeli ${nama}?`)) {
                try {
                    const res = await fetch(`${API_URL}/shop/buy`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                        body: JSON.stringify({ item_id: id, harga_koin: harga, nama_item: nama })
                    });
                    
                    const hasil = await res.json();

                    if (res.ok) {
                        // Update koin di layar dan memori browser
                        USER.koin = hasil.sisa_koin;
                        localStorage.setItem('korisu_user', JSON.stringify(USER));
                        document.getElementById('dompet-header').innerText = `🪙 ${USER.koin} Koin`;

                        alert(hasil.message);
                    } else {
                        alert(hasil.message); // Notifikasi jika koin tidak cukup
                    }
                } catch (error) {
                    alert("Terjadi kesalahan jaringan.");
                }
            }
        }

        document.addEventListener('DOMContentLoaded', muatToko);
    </script>
</body>
</html>
