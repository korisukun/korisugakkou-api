<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis SRS 6 Arah - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #ff7f00;
            --korisu-black: #1a1a1a;
            --korisu-white: #ffffff;
        }
        
        body { 
            background-color: #fafafa; 
            color: var(--korisu-black); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigasi Atas (Solid Orange) */
        .navbar-custom { 
            background-color: var(--korisu-orange); 
            padding: 15px 0;
        }
        .btn-nav-outline {
            background-color: var(--korisu-white);
            color: var(--korisu-orange);
            font-weight: bold;
            border-radius: 25px;
            padding: 8px 25px;
            border: none;
            transition: all 0.2s;
        }
        .btn-nav-outline:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }

        /* Area Konten dengan Dotted Grid Background */
        .content-section {
            flex: 1;
            background-image: radial-gradient(#e0e0e0 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        /* Kartu Kuis Utama (Clean, Soft Shadow, Rounded) */
        .flashcard-modern {
            background-color: var(--korisu-white);
            border: 1px solid #f0f0f0;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* Header Kuis (Timer & Misi) */
        .badge-atas {
            display: inline-block;
            background-color: #fffaf5;
            color: var(--korisu-orange);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ffe8d6;
        }
        .badge-timer {
            background-color: #fff0f0;
            color: #dc3545;
            border: 1px solid #ffdcdc;
        }

        /* Teks Soal */
        .teks-bantuan {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .teks-utama {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--korisu-black);
            margin-bottom: 30px;
            line-height: 1.2;
            word-wrap: break-word;
        }

        /* Tombol Pilihan Ganda */
        .btn-pilihan {
            background-color: var(--korisu-white);
            color: var(--korisu-black);
            border: 1.5px solid #e0e0e0;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            padding: 15px 12px;
            margin-bottom: 15px;
            border-radius: 16px;
            transition: all 0.2s ease;
            text-align: center;
            white-space: normal;
            word-wrap: break-word;
        }
        .btn-pilihan:hover:not(:disabled) {
            border-color: var(--korisu-orange);
            color: var(--korisu-orange);
            background-color: #fffaf5;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,127,0,0.08);
        }
        
        /* State Benar / Salah Lembut */
        .btn-pilihan.benar {
            background-color: #d1e7dd !important;
            color: #0f5132 !important;
            border-color: #198754 !important;
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.15);
        }
        .btn-pilihan.salah {
            background-color: #f8d7da !important;
            color: #842029 !important;
            border-color: #dc3545 !important;
        }

        /* Tombol Aksi */
        .btn-korisu-solid { 
            background-color: var(--korisu-orange); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 1.1rem;
            padding: 14px 20px; 
            transition: all 0.3s; 
            width: 100%;
            margin-top: 15px;
        }
        .btn-korisu-solid:hover { 
            background-color: #e67300; 
            color: white; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(255, 127, 0, 0.25); 
        }
        
        /* Area Notifikasi & Review */
        #hasil-notif { 
            display: none; 
            margin-top: 15px; 
            animation: fadeIn 0.4s ease;
        }
        .jawaban-lengkap { 
            background-color: #fafafa; 
            border: 1px solid #e0e0e0; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Navigasi Atas Minimalis -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="dashboard.html">
                <div style="background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">🐿️</div>
                <span class="d-none d-sm-inline">KORISU Gakkou</span>
            </a>
            <button class="btn-nav-outline" onclick="kembaliKeKelas()">Kembali ke Kelas</button>
        </div>
    </nav>

    <!-- Area Kuis -->
    <div class="content-section">
        <div class="flashcard-modern">
            
            <!-- Header Progress & Timer -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-light">
                <span class="badge-atas">Misi: <span id="progress-text">0 / 0</span></span>
                <span class="badge-atas badge-timer" id="teks-timer">0 Detik ⏱️</span>
            </div>

            <!-- Area Soal Dinamis -->
            <div id="area-soal">
                <p class="teks-bantuan" id="instruksi-soal">Memuat instruksi...</p>
                <h1 class="teks-utama" id="soal-ditampilkan">...</h1>
                
                <!-- Area Pilihan Ganda -->
                <div class="row mt-4" id="area-pilihan-ganda">
                    <!-- Tombol-tombol akan dimunculkan di sini oleh JS -->
                </div>
            </div>

            <!-- Area Hasil Pop-up (Kartu Penjelasan) -->
            <div id="hasil-notif">
                <h3 id="status-jawaban" class="fw-bold mb-4">...</h3>
                
                <div class="jawaban-lengkap text-start">
                    <small class="text-orange d-block mb-2 fw-bold text-uppercase letter-spacing-1">KARTU KOSAKATA LENGKAP</small>
                    <div class="fs-5 mb-2">🇯🇵 <strong>Kanji:</strong> <span id="info-kanji" class="fw-medium text-dark"></span></div>
                    <div class="fs-5 mb-2">🗣️ <strong>Baca:</strong> <span id="info-furi" class="fw-medium text-dark"></span></div>
                    <div class="fs-5">🇮🇩 <strong>Arti:</strong> <span id="info-arti" class="fw-medium text-dark"></span></div>
                </div>

                <div class="bg-light border border-success rounded-4 p-3 mb-4">
                    <h5 class="text-success fw-bold mb-0" id="reward-text">...</h5>
                </div>
                <button class="btn-korisu-solid" id="btn-lanjut" onclick="lanjutSoal()">Lanjutkan Misi ➔</button>
            </div>
            
        </div>
    </div>

    <!-- Script Logika Dipertahankan Utuh -->
    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN_SAYA = localStorage.getItem('korisu_token');

        const urlParams = new URLSearchParams(window.location.search);
        const targetCourseId = urlParams.get('course_id');

        if (!TOKEN_SAYA) window.location.href = "auth.html";
        if (!targetCourseId) window.location.href = "kelas.html";

        function kembaliKeKelas() {
            window.location.href = `kelas.html?course_id=${targetCourseId}`;
        }

        let antreanSoal = [];
        let indeksSaatIni = 0;
        let waktuMulai = 0;
        let timerInterval;
        let detikBerjalan = 0;
        
        let kunciJawabanSaatIni = ""; 
        let vocabSaatIni = null;

        // 1. Ambil Antrean Soal KHUSUS KELAS INI
        async function mulaiSesiSRS() {
            try {
                const res = await fetch(`${API_URL}/srs/today?course_id=${targetCourseId}`, { headers: { 'Authorization': `Bearer ${TOKEN_SAYA}` } });
                const data = await res.json();
                
                if(data.data && data.data.length > 0) {
                    antreanSoal = data.data;
                    indeksSaatIni = 0; 
                    tampilkanSoal(0);
                } else {
                    document.querySelector('.flashcard-modern').innerHTML = `
                        <h1 class="mb-3" style="font-size: 5rem;">🎉</h1>
                        <h3 class="fw-bold mb-3 text-dark">Luar Biasa!</h3>
                        <p class="text-muted fs-5 mb-4">Tidak ada review tersisa untuk kelas ini sekarang. Kosakatamu sudah menempel di otak!</p>
                        <button onclick="window.location.href='kelas.html?course_id=${targetCourseId}'" class="btn-korisu-solid">Kembali ke Kurikulum</button>
                    `;
                }
            } catch (error) {
                document.querySelector('.flashcard-modern').innerHTML = "<h4 class='text-danger'>Gagal terhubung ke server.</h4>";
            }
        }

        // 2. Tampilkan Soal (Arah sesuai database)
        function tampilkanSoal(indeks) {
            vocabSaatIni = antreanSoal[indeks];
            document.getElementById('progress-text').innerText = `${indeks + 1} / ${antreanSoal.length}`;
            
            const modeKuis = parseInt(vocabSaatIni.arah_kuis);
            let soalTeks = "";
            let instruksi = "";
            let fieldTarget = ""; 

            const furiganaAman = vocabSaatIni.furigana ? vocabSaatIni.furigana : vocabSaatIni.kanji;

            switch(modeKuis) {
                case 1: 
                    instruksi = "Pilih Cara Bacanya";
                    soalTeks = vocabSaatIni.kanji;
                    kunciJawabanSaatIni = furiganaAman;
                    fieldTarget = "furigana";
                    break;
                case 2: 
                    instruksi = "Pilih Arti Bahasa Indonesianya";
                    soalTeks = vocabSaatIni.kanji;
                    kunciJawabanSaatIni = vocabSaatIni.arti_indonesia;
                    fieldTarget = "arti_indonesia";
                    break;
                case 3: 
                    instruksi = "Pilih Arti dari kata ini";
                    soalTeks = furiganaAman;
                    kunciJawabanSaatIni = vocabSaatIni.arti_indonesia;
                    fieldTarget = "arti_indonesia";
                    break;
                case 4: 
                    instruksi = "Pilih Kanjinya";
                    soalTeks = furiganaAman;
                    kunciJawabanSaatIni = vocabSaatIni.kanji;
                    fieldTarget = "kanji";
                    break;
                case 5: 
                    instruksi = "Pilih Bahasa Jepangnya (Kanji)";
                    soalTeks = vocabSaatIni.arti_indonesia;
                    kunciJawabanSaatIni = vocabSaatIni.kanji;
                    fieldTarget = "kanji";
                    break;
                case 6: 
                    instruksi = "Pilih Bahasa Jepangnya (Hiragana)";
                    soalTeks = vocabSaatIni.arti_indonesia;
                    kunciJawabanSaatIni = furiganaAman;
                    fieldTarget = "furigana";
                    break;
                default: 
                    instruksi = "Pilih Arti Bahasa Indonesianya";
                    soalTeks = vocabSaatIni.kanji;
                    kunciJawabanSaatIni = vocabSaatIni.arti_indonesia;
                    fieldTarget = "arti_indonesia";
            }

            document.getElementById('instruksi-soal').innerText = instruksi;
            document.getElementById('soal-ditampilkan').innerText = soalTeks;
            
            let statInfo = `📈 Level Kekuatan: ${vocabSaatIni.srs_level || 0} | ⏱️ Avg: ${vocabSaatIni.avg_waktu_detik || 0}s`;
            
            document.getElementById('info-kanji').innerHTML = `${vocabSaatIni.kanji} <br><small class="text-muted fw-normal">${statInfo}</small>`;
            document.getElementById('info-furi').innerText = furiganaAman;
            document.getElementById('info-arti').innerText = vocabSaatIni.arti_indonesia;

            buatPilihanGanda(fieldTarget, kunciJawabanSaatIni);

            document.getElementById('area-soal').style.display = "block";
            document.getElementById('hasil-notif').style.display = "none";
            
            waktuMulai = Date.now();
            clearInterval(timerInterval);
            detikBerjalan = 0;
            document.getElementById('teks-timer').innerText = `0 Detik ⏱️`;
            timerInterval = setInterval(() => {
                detikBerjalan++;
                document.getElementById('teks-timer').innerText = `${detikBerjalan} Detik ⏱️`;
            }, 1000);
        }

        // Algoritma Distraktor Pintar
        function buatPilihanGanda(fieldTarget, kunci) {
            let pilihanSet = new Set();
            pilihanSet.add(kunci); 

            let hasComma = kunci.includes(',');
            let lastChar = kunci.slice(-1);

            let poolPengecoh = antreanSoal.filter(v => {
                let val = fieldTarget === 'furigana' ? (v.furigana || v.kanji) : v[fieldTarget];
                if (val === kunci) return false; 
                if (fieldTarget === 'arti_indonesia' && hasComma && !val.includes(',')) return false;
                if ((fieldTarget === 'furigana' || fieldTarget === 'kanji') && val.slice(-1) !== lastChar) return false;
                return true;
            });

            if (poolPengecoh.length < 3) {
                poolPengecoh = antreanSoal.filter(v => {
                    let val = fieldTarget === 'furigana' ? (v.furigana || v.kanji) : v[fieldTarget];
                    return val !== kunci;
                });
            }

            let limitLoop = 0;
            while(pilihanSet.size < 4 && limitLoop < 100) {
                let randomIndex = Math.floor(Math.random() * poolPengecoh.length);
                let randomVal = fieldTarget === 'furigana' 
                    ? (poolPengecoh[randomIndex].furigana || poolPengecoh[randomIndex].kanji) 
                    : poolPengecoh[randomIndex][fieldTarget];
                
                pilihanSet.add(randomVal);
                limitLoop++;
            }

            let arrayPilihan = Array.from(pilihanSet);
            for (let i = arrayPilihan.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arrayPilihan[i], arrayPilihan[j]] = [arrayPilihan[j], arrayPilihan[i]];
            }

            const wadah = document.getElementById('area-pilihan-ganda');
            wadah.innerHTML = "";
            arrayPilihan.forEach((teksPilihan, idx) => {
                const teksAman = teksPilihan.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                wadah.innerHTML += `
                    <div class="col-sm-6">
                        <button class="btn btn-pilihan" id="btn-pil-${idx}" onclick="cekJawaban('${teksAman}', this.id)">
                            ${teksPilihan}
                        </button>
                    </div>
                `;
            });
        }

        // 3. Evaluasi Jawaban & Kirim Data Arah ke Server
        async function cekJawaban(jawabanUser, btnId) {
            clearInterval(timerInterval);
            const detikDihabiskan = Math.round((Date.now() - waktuMulai) / 1000);
            const vocabId = vocabSaatIni.vocab_id;
            const arahSpesifik = vocabSaatIni.arah_kuis; 
            const isBenar = (jawabanUser === kunciJawabanSaatIni);

            const semuaTombol = document.querySelectorAll('.btn-pilihan');
            semuaTombol.forEach(btn => btn.disabled = true);

            const tombolDipilih = document.getElementById(btnId);
            if (isBenar) {
                tombolDipilih.classList.add('benar');
            } else {
                tombolDipilih.classList.add('salah');
                semuaTombol.forEach(btn => {
                    if (btn.innerText === kunciJawabanSaatIni) btn.classList.add('benar');
                });
            }

            try {
                const res = await fetch(`${API_URL}/srs/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN_SAYA}` },
                    body: JSON.stringify({ 
                        vocab_id: vocabId, 
                        arah_kuis: arahSpesifik, 
                        waktu_jawab_detik: detikDihabiskan, 
                        is_correct: isBenar 
                    })
                });
                
                const hasilBackend = await res.json();
                
                setTimeout(() => {
                    document.getElementById('area-soal').style.display = "none";
                    const notifBox = document.getElementById('hasil-notif');
                    notifBox.style.display = "block";

                    if(isBenar) {
                        document.getElementById('status-jawaban').innerText = `Tepat Sekali! 🎉 (${detikDihabiskan}s)`;
                        document.getElementById('status-jawaban').className = "fw-bold mb-3 text-success";
                        document.getElementById('reward-text').innerText = `+${hasilBackend.reward.exp} EXP  •  +${hasilBackend.reward.koin} Koin 🐿️`;
                        
                        let userSekarang = JSON.parse(localStorage.getItem('korisu_user'));
                        if (userSekarang) {
                            userSekarang.koin = (userSekarang.koin || 0) + hasilBackend.reward.koin;
                            userSekarang.exp = (userSekarang.exp || 0) + hasilBackend.reward.exp;
                            localStorage.setItem('korisu_user', JSON.stringify(userSekarang));
                        }
                    } else {
                        document.getElementById('status-jawaban').innerText = `Jawaban Kurang Tepat`;
                        document.getElementById('status-jawaban').className = "fw-bold mb-3 text-danger";
                        document.getElementById('reward-text').innerText = `Tidak apa-apa, arah memori ini akan direview ulang segera!`;
                    }
                    
                    document.getElementById('btn-lanjut').focus(); 
                }, 1000); 
                
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
                semuaTombol.forEach(btn => btn.disabled = false);
            }
        }

        function lanjutSoal() {
            indeksSaatIni++;
            if (indeksSaatIni < antreanSoal.length) tampilkanSoal(indeksSaatIni);
            else mulaiSesiSRS(); 
        }

        document.addEventListener('DOMContentLoaded', mulaiSesiSRS);
    </script>
</body>
</html>
