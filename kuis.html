<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis SRS - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body {
            background-color: var(--korisu-orange);
            color: var(--korisu-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flashcard {
            background-color: var(--korisu-white);
            border: 3px solid var(--korisu-black);
            border-radius: 15px;
            box-shadow: 8px 8px 0px var(--korisu-black);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }
        .kanji-text {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 0;
        }
        .furigana-text {
            font-size: 1.5rem;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .input-jawaban {
            border: 2px solid var(--korisu-black);
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
        }
        .btn-submit {
            background-color: var(--korisu-black);
            color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            font-weight: bold;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 15px;
        }
        .btn-submit:hover {
            background-color: var(--korisu-orange);
            color: var(--korisu-black);
        }
        /* Area Notifikasi (Sembunyi by default) */
        #hasil-notif {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 2px solid var(--korisu-black);
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="flashcard">
        <!-- Header Progress -->
        <div class="d-flex justify-content-between mb-4 border-bottom pb-2">
            <span class="fw-bold">Misi Harian: <span id="progress-text">0 / 0</span></span>
            <span class="fw-bold text-danger">Waktu Berjalan ⏱️</span>
        </div>

        <!-- Area Soal -->
        <div id="area-soal">
            <p class="furigana-text" id="furigana">Memuat...</p>
            <h1 class="kanji-text" id="kanji">...</h1>
            
            <input type="text" id="input-arti" class="form-control input-jawaban mt-4" placeholder="Ketik arti bahasa Indonesianya..." autocomplete="off">
            <button class="btn btn-submit" onclick="cekJawaban()">JAWAB</button>
        </div>

        <!-- Area Hasil Pop-up (Dalam Card) -->
        <div id="hasil-notif">
            <h4 id="status-jawaban">Benar! 🎉</h4>
            <p class="mb-1" id="arti-sebenarnya">Arti: Kursi Roda</p>
            <p class="text-success mb-3" id="reward-text">+15 EXP | +5 Koin</p>
            <button class="btn btn-submit" onclick="lanjutSoal()">Lanjut Soal Berikutnya</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://korisu-api.onrender.com/api';
        const TOKEN_SAYA = localStorage.getItem('korisu_token');

        // Usir kembali ke halaman login jika tidak ada token (belum masuk)
        if (!TOKEN_SAYA) {
            window.location.href = "auth.html";
        }

        let antreanSoal = [];
        let indeksSaatIni = 0;
        let waktuMulai = 0;

        // 1. Ambil Antrean Soal Hari Ini
        async function mulaiSesiSRS() {
            try {
                const res = await fetch(`${API_URL}/srs/today`, {
                    headers: { 'Authorization': `Bearer ${TOKEN_SAYA}` }
                });
                const data = await res.json();
                
                if(data.data && data.data.length > 0) {
                    antreanSoal = data.data;
                    tampilkanSoal(0);
                } else {
                    document.querySelector('.flashcard').innerHTML = "<h2>🎉 Selesai!</h2><p>Tidak ada lagi kosakata Kaigo yang perlu direview hari ini.</p><a href='dashboard.html' class='btn btn-submit'>Kembali ke Dashboard</a>";
                }
            } catch (error) {
                console.error("Gagal mengambil soal", error);
            }
        }

        // 2. Tampilkan Soal ke Layar & Nyalakan Timer
        function tampilkanSoal(indeks) {
            const soal = antreanSoal[indeks];
            
            document.getElementById('progress-text').innerText = `${indeks + 1} / ${antreanSoal.length}`;
            document.getElementById('kanji').innerText = soal.kanji;
            document.getElementById('furigana').innerText = soal.furigana;
            
            // Reset input dan tampilan
            document.getElementById('input-arti').value = "";
            document.getElementById('area-soal').style.display = "block";
            document.getElementById('hasil-notif').style.display = "none";
            
            // Mulai pencatatan waktu
            waktuMulai = Date.now();
            
            // Fokus otomatis ke kotak ketik
            document.getElementById('input-arti').focus();
        }

        // 3. Evaluasi Jawaban & Hitung Waktu
        async function cekJawaban() {
            const waktuSelesai = Date.now();
            const detikDihabiskan = Math.round((waktuSelesai - waktuMulai) / 1000);
            
            const soal = antreanSoal[indeksSaatIni];
            const jawabanUser = document.getElementById('input-arti').value.toLowerCase().trim();
            const jawabanAsli = soal.arti_indonesia.toLowerCase().trim();
            
            const isBenar = (jawabanUser === jawabanAsli);

            // Kirim hasil ke Backend Node.js
            try {
                const res = await fetch(`${API_URL}/srs/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN_SAYA}`
                    },
                    body: JSON.stringify({
                        vocab_id: soal.vocab_id,
                        waktu_jawab_detik: detikDihabiskan,
                        is_correct: isBenar
                    })
                });
                
                const hasilBackend = await res.json();

                // Tampilkan notifikasi (DOM Manipulation yang tidak merusak layout background)
                document.getElementById('area-soal').style.display = "none";
                document.getElementById('hasil-notif').style.display = "block";
                
                document.getElementById('arti-sebenarnya').innerText = `Artinya: ${soal.arti_indonesia}`;

                const notifBox = document.getElementById('hasil-notif');
                if(isBenar) {
                    notifBox.style.backgroundColor = "#d1e7dd"; // Hijau muda Bootstrap
                    document.getElementById('status-jawaban').innerText = `Benar! ⏱️ ${detikDihabiskan} Detik`;
                    document.getElementById('reward-text').innerText = `+${hasilBackend.reward.exp} EXP | +${hasilBackend.reward.koin} Koin Tupai 🐿️`;
                } else {
                    notifBox.style.backgroundColor = "#f8d7da"; // Merah muda Bootstrap
                    document.getElementById('status-jawaban').innerText = `Kurang Tepat!`;
                    document.getElementById('reward-text').innerText = `Jangan menyerah, kita coba lagi nanti!`;
                }
                
            } catch (error) {
                console.error("Gagal mengirim jawaban", error);
            }
        }

        // 4. Lanjut ke Soal Berikutnya
        function lanjutSoal() {
            indeksSaatIni++;
            if (indeksSaatIni < antreanSoal.length) {
                tampilkanSoal(indeksSaatIni);
            } else {
                // Jika soal habis, panggil fungsi fetch lagi untuk ngecek (siapa tau ada yang harus diulang)
                mulaiSesiSRS();
            }
        }

        // Memungkinkan tekan "Enter" untuk menjawab
        document.getElementById("input-arti").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                cekJawaban();
            }
        });

        // Eksekusi pertama kali
        document.addEventListener('DOMContentLoaded', mulaiSesiSRS);
    </script>
</body>
</html>
