<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis SRS 6 Arah (Pilihan Ganda) - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body {
            background-color: var(--korisu-orange);
            color: var(--korisu-black);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flashcard {
            background-color: var(--korisu-white);
            border: 3px solid var(--korisu-black);
            border-radius: 15px;
            box-shadow: 8px 8px 0px var(--korisu-black);
            width: 100%;
            max-width: 550px;
            padding: 2rem;
            text-align: center;
            margin: 1rem;
        }
        .teks-utama {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.2;
            word-wrap: break-word;
        }
        .teks-bantuan {
            font-size: 1.1rem;
            color: var(--korisu-orange);
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-pilihan {
            background-color: var(--korisu-white);
            color: var(--korisu-black);
            border: 2px solid var(--korisu-black);
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            transition: all 0.2s;
            text-align: center;
            white-space: normal;
            word-wrap: break-word;
        }
        .btn-pilihan:hover:not(:disabled) {
            background-color: var(--korisu-orange);
            color: var(--korisu-white);
            transform: translateY(-2px);
        }
        .btn-pilihan.benar {
            background-color: #198754 !important;
            color: white !important;
            border-color: #146c43 !important;
        }
        .btn-pilihan.salah {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #b02a37 !important;
        }
        .btn-submit {
            background-color: var(--korisu-black);
            color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            font-weight: bold;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
        }
        .btn-submit:hover { background-color: var(--korisu-orange); color: var(--korisu-black); }
        
        #hasil-notif { display: none; margin-top: 20px; padding: 20px; border: 2px solid var(--korisu-black); border-radius: 10px; }
        .jawaban-lengkap { background-color: #f8f9fa; border: 1px dashed var(--korisu-black); border-radius: 8px; padding: 10px; margin-bottom: 15px;}
    </style>
</head>
<body>

    <div class="flashcard">
        <!-- Header Progress & Timer -->
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <span class="fw-bold fs-5">Misi: <span id="progress-text">0 / 0</span></span>
            <span class="fw-bold text-danger fs-5" id="teks-timer">0 Detik ⏱️</span>
        </div>

        <!-- Area Soal Dinamis -->
        <div id="area-soal">
            <p class="teks-bantuan" id="instruksi-soal">Memuat instruksi...</p>
            <h1 class="teks-utama mb-4" id="soal-ditampilkan">...</h1>
            
            <!-- Area Pilihan Ganda -->
            <div class="row" id="area-pilihan-ganda">
                <!-- Tombol-tombol akan dimunculkan di sini oleh JS -->
            </div>
        </div>

        <!-- Area Hasil Pop-up -->
        <div id="hasil-notif">
            <h3 id="status-jawaban" class="fw-bold mb-2">...</h3>
            
            <div class="jawaban-lengkap text-start">
                <small class="text-muted d-block mb-1 fw-bold">KARTU KOSAKATA:</small>
                <div class="fs-5">🇯🇵 Kanji: <strong id="info-kanji"></strong></div>
                <div class="fs-5">🗣️ Baca: <strong id="info-furi"></strong></div>
                <div class="fs-5">🇮🇩 Arti: <strong id="info-arti"></strong></div>
            </div>

            <div class="bg-white border border-dark rounded p-2 mb-3">
                <h5 class="text-success fw-bold mb-0" id="reward-text">...</h5>
            </div>
            <button class="btn btn-submit" id="btn-lanjut" onclick="lanjutSoal()">Lanjut ➔</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN_SAYA = localStorage.getItem('korisu_token');

        if (!TOKEN_SAYA) window.location.href = "auth.html";

        let antreanSoal = [];
        let indeksSaatIni = 0;
        let waktuMulai = 0;
        let timerInterval;
        let detikBerjalan = 0;
        
        let kunciJawabanSaatIni = ""; 
        let vocabSaatIni = null;

        // 1. Ambil Antrean Soal
        async function mulaiSesiSRS() {
            try {
                const res = await fetch(`${API_URL}/srs/today`, { headers: { 'Authorization': `Bearer ${TOKEN_SAYA}` } });
                const data = await res.json();
                
                if(data.data && data.data.length > 0) {
                    antreanSoal = data.data;
                    tampilkanSoal(0);
                } else {
                    document.querySelector('.flashcard').innerHTML = `
                        <h1 class="mb-3">🎉</h1>
                        <h3 class="fw-bold mb-3">Misi Selesai!</h3>
                        <p class="text-muted mb-4">Kamu sudah menyelesaikan seluruh review hari ini!</p>
                        <button onclick="window.location.href='dashboard.html'" class="btn btn-submit">Ke Dashboard</button>
                    `;
                }
            } catch (error) {
                document.querySelector('.flashcard').innerHTML = "<h4 class='text-danger'>Gagal terhubung ke server.</h4>";
            }
        }

        // 2. Tampilkan Soal (Diacak 6 Arah)
        function tampilkanSoal(indeks) {
            vocabSaatIni = antreanSoal[indeks];
            document.getElementById('progress-text').innerText = `${indeks + 1} / ${antreanSoal.length}`;
            
            // Logika Acak 1 sampai 6
            const modeKuis = Math.floor(Math.random() * 6) + 1;
            
            let soalTeks = "";
            let instruksi = "";
            let fieldTarget = ""; // Untuk menentukan data apa yang dijadikan pilihan (A, B, C, D)

            // Mencegah error jika furigana kosong
            const furiganaAman = vocabSaatIni.furigana ? vocabSaatIni.furigana : vocabSaatIni.kanji;

            switch(modeKuis) {
                case 1: // Kanji -> Hiragana
                    instruksi = "Pilih Cara Bacanya";
                    soalTeks = vocabSaatIni.kanji;
                    kunciJawabanSaatIni = furiganaAman;
                    fieldTarget = "furigana";
                    break;
                case 2: // Kanji -> Arti
                    instruksi = "Pilih Arti dari Kanji ini";
                    soalTeks = vocabSaatIni.kanji;
                    kunciJawabanSaatIni = vocabSaatIni.arti_indonesia;
                    fieldTarget = "arti_indonesia";
                    break;
                case 3: // Hiragana -> Arti
                    instruksi = "Pilih Arti dari kata ini";
                    soalTeks = furiganaAman;
                    kunciJawabanSaatIni = vocabSaatIni.arti_indonesia;
                    fieldTarget = "arti_indonesia";
                    break;
                case 4: // Hiragana -> Kanji
                    instruksi = "Pilih Kanjinya";
                    soalTeks = furiganaAman;
                    kunciJawabanSaatIni = vocabSaatIni.kanji;
                    fieldTarget = "kanji";
                    break;
                case 5: // Arti -> Kanji
                    instruksi = "Pilih Kanjinya";
                    soalTeks = vocabSaatIni.arti_indonesia;
                    kunciJawabanSaatIni = vocabSaatIni.kanji;
                    fieldTarget = "kanji";
                    break;
                case 6: // Arti -> Hiragana
                    instruksi = "Pilih Bahasa Jepangnya";
                    soalTeks = vocabSaatIni.arti_indonesia;
                    kunciJawabanSaatIni = furiganaAman;
                    fieldTarget = "furigana";
                    break;
            }

            document.getElementById('instruksi-soal').innerText = instruksi;
            document.getElementById('soal-ditampilkan').innerText = soalTeks;
            
            // Isi kartu info lengkap untuk halaman hasil
            document.getElementById('info-kanji').innerText = vocabSaatIni.kanji;
            document.getElementById('info-furi').innerText = furiganaAman;
            document.getElementById('info-arti').innerText = vocabSaatIni.arti_indonesia;

            // Generate Pilihan Ganda
            buatPilihanGanda(fieldTarget, kunciJawabanSaatIni);

            // Reset UI
            document.getElementById('area-soal').style.display = "block";
            document.getElementById('hasil-notif').style.display = "none";
            
            waktuMulai = Date.now();
            clearInterval(timerInterval);
            detikBerjalan = 0;
            document.getElementById('teks-timer').innerText = `0 Detik ⏱️`;
            timerInterval = setInterval(() => {
                detikBerjalan++;
                document.getElementById('teks-timer').innerText = `${detikBerjalan} Detik ⏱️`;
            }, 1000);
        }

        // ALGORITMA DISTRAKTOR PINTAR (MENGECOH)
        function buatPilihanGanda(fieldTarget, kunci) {
            let pilihanSet = new Set();
            pilihanSet.add(kunci); // Masukkan jawaban benar

            // Analisis Kunci Jawaban untuk pengecoh yang setara
            let hasComma = kunci.includes(',');
            let lastChar = kunci.slice(-1);

            // Filter antreanSoal untuk mencari pengecoh yang mirip
            let poolPengecoh = antreanSoal.filter(v => {
                let val = fieldTarget === 'furigana' ? (v.furigana || v.kanji) : v[fieldTarget];
                if (val === kunci) return false; // Jangan masukkan kunci yang sama

                // Aturan Mengecoh: Samakan koma, atau samakan akhiran hiragana (seperti く, る)
                if (fieldTarget === 'arti_indonesia' && hasComma && !val.includes(',')) return false;
                if ((fieldTarget === 'furigana' || fieldTarget === 'kanji') && val.slice(-1) !== lastChar) return false;
                
                return true;
            });

            // Jika pengecoh pintar kurang dari 3, ambil dari seluruh soal N5
            if (poolPengecoh.length < 3) {
                poolPengecoh = antreanSoal.filter(v => {
                    let val = fieldTarget === 'furigana' ? (v.furigana || v.kanji) : v[fieldTarget];
                    return val !== kunci;
                });
            }

            // Ambil acak hingga genap 4 pilihan
            let limitLoop = 0;
            while(pilihanSet.size < 4 && limitLoop < 100) {
                let randomIndex = Math.floor(Math.random() * poolPengecoh.length);
                let randomVal = fieldTarget === 'furigana' 
                    ? (poolPengecoh[randomIndex].furigana || poolPengecoh[randomIndex].kanji) 
                    : poolPengecoh[randomIndex][fieldTarget];
                
                pilihanSet.add(randomVal);
                limitLoop++;
            }

            // Acak urutan (Shuffle)
            let arrayPilihan = Array.from(pilihanSet);
            for (let i = arrayPilihan.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arrayPilihan[i], arrayPilihan[j]] = [arrayPilihan[j], arrayPilihan[i]];
            }

            // Render ke HTML
            const wadah = document.getElementById('area-pilihan-ganda');
            wadah.innerHTML = "";
            arrayPilihan.forEach((teksPilihan, idx) => {
                // Konversi kutip agar tidak merusak HTML string
                const teksAman = teksPilihan.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                wadah.innerHTML += `
                    <div class="col-6">
                        <button class="btn btn-pilihan" id="btn-pil-${idx}" onclick="cekJawaban('${teksAman}', this.id)">
                            ${teksPilihan}
                        </button>
                    </div>
                `;
            });
        }

        // 3. Evaluasi Jawaban Terpilih
        async function cekJawaban(jawabanUser, btnId) {
            clearInterval(timerInterval);
            const detikDihabiskan = Math.round((Date.now() - waktuMulai) / 1000);
            const vocabId = vocabSaatIni.vocab_id;
            
            const isBenar = (jawabanUser === kunciJawabanSaatIni);

            // Kunci semua tombol agar tidak diklik dua kali
            const semuaTombol = document.querySelectorAll('.btn-pilihan');
            semuaTombol.forEach(btn => btn.disabled = true);

            // Beri warna pada tombol yang diklik
            const tombolDipilih = document.getElementById(btnId);
            if (isBenar) {
                tombolDipilih.classList.add('benar');
            } else {
                tombolDipilih.classList.add('salah');
                // Highlight mana jawaban yang sebenarnya benar
                semuaTombol.forEach(btn => {
                    if (btn.innerText === kunciJawabanSaatIni) btn.classList.add('benar');
                });
            }

            try {
                // Kirim ke Backend
                const res = await fetch(`${API_URL}/srs/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN_SAYA}` },
                    body: JSON.stringify({ vocab_id: vocabId, waktu_jawab_detik: detikDihabiskan, is_correct: isBenar })
                });
                
                const hasilBackend = await res.json();
                
                // Tunda 1 detik agar murid sempat melihat warna hijau/merah di pilihan gandanya
                setTimeout(() => {
                    document.getElementById('area-soal').style.display = "none";
                    const notifBox = document.getElementById('hasil-notif');
                    notifBox.style.display = "block";

                    if(isBenar) {
                        notifBox.style.backgroundColor = "#d1e7dd"; 
                        notifBox.style.borderColor = "#0f5132";
                        document.getElementById('status-jawaban').innerText = `Tepat Sekali! 🎉 (${detikDihabiskan}s)`;
                        document.getElementById('status-jawaban').className = "fw-bold mb-3 text-success";
                        document.getElementById('reward-text').innerText = `+${hasilBackend.reward.exp} EXP | +${hasilBackend.reward.koin} Koin 🐿️`;
                        
                        let userSekarang = JSON.parse(localStorage.getItem('korisu_user'));
                        if (userSekarang) {
                            userSekarang.koin = (userSekarang.koin || 0) + hasilBackend.reward.koin;
                            userSekarang.exp = (userSekarang.exp || 0) + hasilBackend.reward.exp;
                            localStorage.setItem('korisu_user', JSON.stringify(userSekarang));
                        }
                    } else {
                        notifBox.style.backgroundColor = "#f8d7da"; 
                        notifBox.style.borderColor = "#842029";
                        document.getElementById('status-jawaban').innerText = `Jawaban Kurang Tepat!`;
                        document.getElementById('status-jawaban').className = "fw-bold mb-3 text-danger";
                        document.getElementById('reward-text').innerText = `Tidak apa-apa, kita review lagi nanti!`;
                    }
                    
                    document.getElementById('btn-lanjut').focus(); // Fokus ke tombol lanjut agar bisa dienter
                }, 1000); // Jeda 1 detik
                
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
                semuaTombol.forEach(btn => btn.disabled = false);
            }
        }

        function lanjutSoal() {
            indeksSaatIni++;
            if (indeksSaatIni < antreanSoal.length) tampilkanSoal(indeksSaatIni);
            else mulaiSesiSRS(); // Refresh antrean dari server
        }

        document.addEventListener('DOMContentLoaded', mulaiSesiSRS);
    </script>
</body>
</html>
