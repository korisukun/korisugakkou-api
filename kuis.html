<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis SRS - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body {
            background-color: var(--korisu-orange);
            color: var(--korisu-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flashcard {
            background-color: var(--korisu-white);
            border: 3px solid var(--korisu-black);
            border-radius: 15px;
            box-shadow: 8px 8px 0px var(--korisu-black);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
            margin: 1rem;
        }
        .kanji-text {
            font-size: 4.5rem;
            font-weight: bold;
            margin-bottom: 0;
            line-height: 1.2;
        }
        .furigana-text {
            font-size: 1.5rem;
            color: #6c757d;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .input-jawaban {
            border: 2px solid var(--korisu-black);
            font-size: 1.2rem;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
        }
        .input-jawaban:focus {
            border-color: var(--korisu-orange);
            box-shadow: 0 0 0 0.25rem rgba(253, 126, 20, 0.25);
        }
        .btn-submit {
            background-color: var(--korisu-black);
            color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            font-weight: bold;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background-color: var(--korisu-orange);
            color: var(--korisu-black);
        }
        #hasil-notif {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 2px solid var(--korisu-black);
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="flashcard">
        <!-- Header Progress & Timer -->
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <span class="fw-bold fs-5">Misi: <span id="progress-text">0 / 0</span></span>
            <span class="fw-bold text-danger fs-5" id="teks-timer">0 Detik ⏱️</span>
        </div>

        <!-- Area Soal -->
        <div id="area-soal">
            <p class="furigana-text" id="furigana">Memuat...</p>
            <h1 class="kanji-text" id="kanji">...</h1>
            
            <input type="text" id="input-arti" class="form-control input-jawaban mt-4" placeholder="Ketik arti bahasa Indonesianya..." autocomplete="off">
            <button class="btn btn-submit" id="btn-jawab" onclick="cekJawaban()">JAWAB SEKARANG</button>
        </div>

        <!-- Area Hasil Pop-up (Menyatu dalam Card agar Layout Tidak Rusak) -->
        <div id="hasil-notif">
            <h3 id="status-jawaban" class="fw-bold mb-2">Benar! 🎉</h3>
            <h5 class="mb-3 text-muted" id="arti-sebenarnya">Arti: ...</h5>
            <div class="bg-white border border-dark rounded p-2 mb-3">
                <h5 class="text-success fw-bold mb-0" id="reward-text">+0 EXP | +0 Koin</h5>
            </div>
            <button class="btn btn-submit" onclick="lanjutSoal()">Lanjut Soal Berikutnya ➔</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN_SAYA = localStorage.getItem('korisu_token');

        if (!TOKEN_SAYA) {
            window.location.href = "auth.html";
        }

        let antreanSoal = [];
        let indeksSaatIni = 0;
        let waktuMulai = 0;
        let timerInterval;
        let detikBerjalan = 0;

        // 1. Ambil Antrean Soal Hari Ini
        async function mulaiSesiSRS() {
            try {
                const res = await fetch(`${API_URL}/srs/today`, {
                    headers: { 'Authorization': `Bearer ${TOKEN_SAYA}` }
                });
                const data = await res.json();
                
                if(data.data && data.data.length > 0) {
                    antreanSoal = data.data;
                    tampilkanSoal(0);
                } else {
                    document.querySelector('.flashcard').innerHTML = `
                        <h1 class="mb-3">🎉</h1>
                        <h3 class="fw-bold mb-3">Misi Selesai!</h3>
                        <p class="text-muted mb-4">Tidak ada lagi kosakata yang perlu direview hari ini. Kembalilah besok untuk menjaga streak-mu!</p>
                        <button onclick="window.location.href='dashboard.html'" class="btn btn-submit">Kembali ke Dashboard</button>
                    `;
                }
            } catch (error) {
                console.error("Gagal mengambil soal", error);
                document.querySelector('.flashcard').innerHTML = "<h4 class='text-danger'>Gagal terhubung ke server.</h4>";
            }
        }

        // 2. Tampilkan Soal & Nyalakan Timer
        function tampilkanSoal(indeks) {
            const soal = antreanSoal[indeks];
            
            document.getElementById('progress-text').innerText = `${indeks + 1} / ${antreanSoal.length}`;
            document.getElementById('kanji').innerText = soal.kanji;
            document.getElementById('furigana').innerText = soal.furigana || '-';
            
            // Reset tampilan form
            document.getElementById('input-arti').value = "";
            document.getElementById('area-soal').style.display = "block";
            document.getElementById('hasil-notif').style.display = "none";
            document.getElementById('btn-jawab').disabled = false;
            document.getElementById('btn-jawab').innerText = "JAWAB SEKARANG";
            
            waktuMulai = Date.now();
            
            // Nyalakan Timer
            clearInterval(timerInterval);
            detikBerjalan = 0;
            document.getElementById('teks-timer').innerText = `0 Detik ⏱️`;
            timerInterval = setInterval(() => {
                detikBerjalan++;
                document.getElementById('teks-timer').innerText = `${detikBerjalan} Detik ⏱️`;
            }, 1000);
            
            document.getElementById('input-arti').focus();
        }

        // 3. Evaluasi Jawaban & Update Data Lokal
        async function cekJawaban() {
            const btnJawab = document.getElementById('btn-jawab');
            btnJawab.disabled = true;
            btnJawab.innerText = "MEMERIKSA...";

            clearInterval(timerInterval);
            const waktuSelesai = Date.now();
            const detikDihabiskan = Math.round((waktuSelesai - waktuMulai) / 1000);
            
            const soal = antreanSoal[indeksSaatIni];
            const jawabanUser = document.getElementById('input-arti').value.toLowerCase().trim();
            const jawabanAsli = soal.arti_indonesia.toLowerCase().trim();
            
            const isBenar = (jawabanUser === jawabanAsli);

            try {
                const res = await fetch(`${API_URL}/srs/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN_SAYA}`
                    },
                    body: JSON.stringify({
                        vocab_id: soal.vocab_id,
                        waktu_jawab_detik: detikDihabiskan,
                        is_correct: isBenar
                    })
                });
                
                const hasilBackend = await res.json();

                // Manipulasi DOM untuk menampilkan hasil
                document.getElementById('area-soal').style.display = "none";
                const notifBox = document.getElementById('hasil-notif');
                notifBox.style.display = "block";
                
                document.getElementById('arti-sebenarnya').innerText = `Artinya: ${soal.arti_indonesia}`;

                if(isBenar) {
                    notifBox.style.backgroundColor = "#d1e7dd"; // Hijau Bootstrap
                    notifBox.style.borderColor = "#0f5132";
                    document.getElementById('status-jawaban').innerText = `Tepat Sekali! ⏱️ ${detikDihabiskan}s`;
                    document.getElementById('status-jawaban').className = "fw-bold mb-2 text-success";
                    document.getElementById('reward-text').innerText = `+${hasilBackend.reward.exp} EXP | +${hasilBackend.reward.koin} Koin Tupai 🐿️`;
                    
                    // Update Dompet di Memori Browser agar sinkron dengan Dashboard
                    let userSekarang = JSON.parse(localStorage.getItem('korisu_user'));
                    if (userSekarang) {
                        userSekarang.koin = (userSekarang.koin || 0) + hasilBackend.reward.koin;
                        userSekarang.exp = (userSekarang.exp || 0) + hasilBackend.reward.exp;
                        localStorage.setItem('korisu_user', JSON.stringify(userSekarang));
                    }
                } else {
                    notifBox.style.backgroundColor = "#f8d7da"; // Merah Bootstrap
                    notifBox.style.borderColor = "#842029";
                    document.getElementById('status-jawaban').innerText = `Kurang Tepat!`;
                    document.getElementById('status-jawaban').className = "fw-bold mb-2 text-danger";
                    document.getElementById('reward-text').innerText = `Review lagi nanti ya! 頑張って (Ganbatte)!`;
                }
                
            } catch (error) {
                console.error("Gagal mengirim jawaban", error);
                alert("Terjadi kesalahan jaringan.");
                btnJawab.disabled = false;
                btnJawab.innerText = "JAWAB SEKARANG";
            }
        }

        // 4. Lanjut ke Soal Berikutnya
        function lanjutSoal() {
            indeksSaatIni++;
            if (indeksSaatIni < antreanSoal.length) {
                tampilkanSoal(indeksSaatIni);
            } else {
                // Tarik ulang API untuk memastikan tidak ada soal 'again' (salah jawab) yang terlewat
                mulaiSesiSRS();
            }
        }

        // Fitur tekan 'Enter' untuk menjawab
        document.getElementById("input-arti").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                // Cegah spam enter jika tombol sudah didisable
                if (!document.getElementById('btn-jawab').disabled) {
                    cekJawaban();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', mulaiSesiSRS);
    </script>
</body>
</html>
