<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Kelas - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body {
            background-color: #f8f9fa;
            color: var(--korisu-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-korisu {
            background-color: var(--korisu-orange);
        }
        .course-card {
            background-color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--korisu-black);
            transition: transform 0.2s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .course-card:hover {
            transform: translateY(-5px);
        }
        .course-thumbnail {
            background-color: var(--korisu-black);
            color: var(--korisu-orange);
            height: 150px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
        }
        .course-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .btn-akses {
            background-color: var(--korisu-orange);
            color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            font-weight: bold;
            width: 100%;
            margin-top: auto; /* Mendorong tombol ke bawah */
        }
        .btn-akses:hover {
            background-color: var(--korisu-black);
            color: var(--korisu-white);
        }
        .badge-level {
            background-color: var(--korisu-black);
            color: var(--korisu-white);
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Navigasi Atas -->
    <nav class="navbar navbar-dark navbar-korisu shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">⬅️ Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="mb-4 border-bottom pb-3">
            <h2 class="fw-bold">📺 Katalog Video Kelas</h2>
            <p class="text-muted">Pilih materi yang ingin kamu pelajari hari ini.</p>
        </div>

        <!-- Rak Kelas (Grid System Bootstrap) -->
        <div class="row g-4" id="rak-kelas">
            <!-- Kartu kelas akan dirender oleh JavaScript di sini -->
        </div>
    </div>

    <script>
        // 1. Validasi Keamanan Token
        const TOKEN_SAYA = localStorage.getItem('korisu_token');
        if (!TOKEN_SAYA) {
            window.location.href = "auth.html";
        }

        // 2. Data Simulasi Kelas (Nanti akan ditarik dari API Database LMS)
        const dataKelas = [
            {
                id: 1,
                judul: "Persiapan Ujian Kaigo Kokka Shiken",
                deskripsi: "Materi esensial dan pembahasan kosakata khusus asuhan keperawatan lansia untuk lulus ujian Kaigo.",
                level: "Kaigo",
                icon: "🏥"
            },
            {
                id: 2,
                judul: "90 Days Challenge JLPT N3",
                deskripsi: "Program intensif 3 bulan menguasai tata bahasa, kosakata, dan pemahaman bacaan untuk tembus N3.",
                level: "JLPT N3",
                icon: "🎯"
            },
            {
                id: 3,
                judul: "Fundamental Bahasa Jepang",
                deskripsi: "Materi dasar hiragana, katakana, dan pola kalimat awal. Sangat cocok untuk anak muda pemula!",
                level: "JLPT N5",
                icon: "🌸"
            },
            {
                id: 4,
                judul: "Kanji Sehari-hari Level Menengah",
                deskripsi: "Tingkatkan kemampuan membaca huruf Kanji yang sering muncul di kehidupan nyata di Jepang.",
                level: "JLPT N4",
                icon: "⛩️"
            }
        ];

        // 3. Fungsi Menampilkan Kelas ke HTML
        function renderKelas() {
            const rak = document.getElementById('rak-kelas');
            rak.innerHTML = '';

            dataKelas.forEach(kelas => {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4'; // Responsive: 2 kolom di tablet, 3 kolom di laptop

                col.innerHTML = `
                    <div class="course-card">
                        <div class="course-thumbnail">
                            ${kelas.icon}
                        </div>
                        <div class="course-body">
                            <div>
                                <span class="badge-level">${kelas.level}</span>
                            </div>
                            <h5 class="fw-bold mt-2">${kelas.judul}</h5>
                            <p class="text-muted small">${kelas.deskripsi}</p>
                            <button class="btn btn-akses mt-3" onclick="bukaKelas(${kelas.id})">Tonton Video</button>
                        </div>
                    </div>
                `;
                rak.appendChild(col);
            });
        }

        // 4. Fungsi Navigasi ke Halaman Pemutar Video
        function bukaKelas(kelasId) {
            // Menyimpan ID kelas yang dipilih ke memori sementara
            localStorage.setItem('korisu_kelas_aktif', kelasId);
            // Berpindah ke halaman pemutar video
            window.location.href = "video-player.html";
        }

        // Eksekusi saat halaman dimuat
        document.addEventListener('DOMContentLoaded', renderKelas);
    </script>
</body>
</html>
