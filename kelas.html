<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Kelas - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body { 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* Mencegah layar melar ke samping jika ada elemen yang melebar */
            overflow-x: hidden; 
        }
        .navbar-korisu { background-color: var(--korisu-orange); }
        .card-custom {
            background-color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--korisu-black);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Rasio 16:9 yang sempurna */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid var(--korisu-black);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .playlist-item {
            cursor: pointer;
            border-bottom: 1px solid #dee2e6;
            padding: 10px;
            transition: background-color 0.2s;
        }
        .playlist-item:hover, .playlist-item.active {
            background-color: #ffe8d6;
            border-left: 4px solid var(--korisu-orange);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-korisu shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">📺 Kelas KORISU Gakkou</a>
            <button class="btn btn-sm btn-light fw-bold" onclick="kembali()">Kembali</button>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row">
            
            <!-- Area Pemutar Video -->
            <div class="col-lg-8 mb-4">
                <div class="card card-custom p-3">
                    <h3 class="fw-bold mb-3" id="judul-video-aktif">Memuat Kelas...</h3>
                    <div class="video-container">
                        <iframe id="frame-video" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <div class="mt-3">
                        <h5 class="fw-bold">Deskripsi Materi:</h5>
                        <p id="deskripsi-video-aktif" class="text-muted">Silakan tunggu sebentar...</p>
                    </div>
                </div>
            </div>

            <!-- Area Daftar Putar (Playlist) -->
            <div class="col-lg-4">
                <div class="card card-custom p-0 overflow-hidden">
                    <div class="bg-dark text-white p-3">
                        <h5 class="fw-bold mb-0">📚 Daftar Materi</h5>
                    </div>
                    <div id="daftar-playlist" class="list-group list-group-flush" style="max-height: 500px; overflow-y: auto;">
                        <!-- Daftar video akan dimuat di sini oleh JavaScript -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        let daftarMateri = [];

        // Tendang penyusup yang tidak punya token
        if (!TOKEN) {
            window.location.href = "auth.html";
        }

        function kembali() {
            window.location.href = "dashboard.html";
        }

        // Mengambil daftar kelas dari Backend
        async function muatKelas() {
            try {
                const res = await fetch(`${API_URL}/courses`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();

                if (res.ok) {
                    daftarMateri = data.materi;
                    renderPlaylist();
                    if (daftarMateri.length > 0) {
                        putarVideo(0); // Putar video urutan pertama secara default
                    }
                } else {
                    alert("Gagal memuat materi: " + data.message);
                }
            } catch (error) {
                console.error("Error jaringan:", error);
            }
        }

        // Menyusun daftar putar di sebelah kanan
        function renderPlaylist() {
            const wadahPlaylist = document.getElementById('daftar-playlist');
            wadahPlaylist.innerHTML = "";

            daftarMateri.forEach((materi, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === 0 ? 'active' : ''}`;
                item.id = `playlist-item-${index}`;
                item.innerHTML = `<h6 class="fw-bold mb-1">${materi.judul}</h6>`;
                item.onclick = () => putarVideo(index);
                wadahPlaylist.appendChild(item);
            });
        }

        // Mengganti video utama saat daftar putar diklik
        function putarVideo(indeks) {
            const materiPilihan = daftarMateri[indeks];
            
            // Perbarui Judul & Frame
            document.getElementById('judul-video-aktif').innerText = materiPilihan.judul;
            document.getElementById('deskripsi-video-aktif').innerText = materiPilihan.deskripsi;
            document.getElementById('frame-video').src = materiPilihan.url_video;

            // Perbarui warna sorotan di daftar putar
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`playlist-item-${indeks}`).classList.add('active');
        }

        // Jalankan saat layar pertama kali dibuka
        document.addEventListener('DOMContentLoaded', muatKelas);
    </script>
</body>
</html>
