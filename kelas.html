<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Kelas - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #ff7f00;
            --korisu-black: #1a1a1a;
            --korisu-white: #ffffff;
        }
        
        body { background-color: #fafafa; color: var(--korisu-black); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-custom { background-color: var(--korisu-orange); padding: 15px 0; }
        .btn-nav-outline { background-color: var(--korisu-white); color: var(--korisu-orange); font-weight: bold; border-radius: 25px; padding: 8px 25px; border: none; transition: all 0.2s; }
        .btn-nav-outline:hover { background-color: #f8f9fa; transform: translateY(-2px); }
        .content-section { flex: 1; background-image: radial-gradient(#e0e0e0 2px, transparent 2px); background-size: 30px 30px; padding-bottom: 60px; }
        .header-section { background-color: var(--korisu-white); padding: 50px 0; text-align: center; border-bottom: 1px solid #f0f0f0; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .badge-atas { display: inline-block; background-color: #fffaf5; color: var(--korisu-orange); font-weight: 700; font-size: 0.85rem; padding: 8px 16px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #ffe8d6; }
        .heading-main { font-weight: 900; font-size: 3rem; letter-spacing: -1px; color: var(--korisu-black); margin-bottom: 15px; }

        .card-course { background-color: var(--korisu-white); border: 1px solid #f0f0f0; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; height: 100%; display: flex; flex-direction: column; padding: 30px; }
        .card-course:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: #ffe8d6; }
        .thumbnail-icon { font-size: 4rem; text-align: center; margin-bottom: 20px; background: linear-gradient(135deg, #fffaf5 0%, #fff0e5 100%); width: 100px; height: 100px; line-height: 100px; border-radius: 50%; margin-left: auto; margin-right: auto; }

        .accordion-item { border: 1px solid #f0f0f0; border-radius: 16px !important; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden; }
        .accordion-button { font-weight: 700; font-size: 1.1rem; background-color: var(--korisu-white); color: var(--korisu-black); padding: 20px; border: none; box-shadow: none !important; }
        .accordion-button:not(.collapsed) { background-color: #fffaf5; color: var(--korisu-orange); }
        .accordion-body { padding: 0; background-color: var(--korisu-white); }
        .lesson-item { padding: 18px 25px; border-top: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; transition: all 0.2s ease; }
        .lesson-item:hover { background-color: #fffaf5; padding-left: 32px; color: var(--korisu-orange); }
        .lesson-icon { font-size: 1.5rem; margin-right: 15px; }

        .btn-korisu-solid { background-color: var(--korisu-orange); color: white; border: none; border-radius: 12px; font-weight: bold; padding: 12px 20px; transition: all 0.3s; }
        .btn-korisu-solid:hover { background-color: #e67300; color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 127, 0, 0.25); }
        .btn-enroll-success { background-color: #198754; color: white; border: none; border-radius: 15px; font-weight: 800; padding: 15px 30px; font-size: 1.1rem; transition: all 0.3s; box-shadow: 0 8px 20px rgba(25, 135, 84, 0.2); }
        .btn-enroll-success:hover:not(:disabled) { background-color: #146c43; transform: translateY(-2px); box-shadow: 0 12px 25px rgba(25, 135, 84, 0.3); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="dashboard.html">
                <div style="background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">🐿️</div>
                <span class="d-none d-sm-inline">KORISU Gakkou</span>
            </a>
            <button class="btn-nav-outline" onclick="window.location.href='dashboard.html'">Kembali ke Dasbor</button>
        </div>
    </nav>

    <!-- TAMPILAN 1: KATALOG KELAS -->
    <div id="view-katalog" class="content-section">
        <div class="header-section mt-0">
            <div class="container">
                <div class="badge-atas">📚 Katalog Kelas</div>
                <h1 class="heading-main">Jelajahi <span style="color: var(--korisu-orange);">Kelas Kami</span></h1>
                <p class="text-muted fs-5 mx-auto" style="max-width: 600px;">Pilih program belajar yang sesuai dengan targetmu untuk memulai *Learning Journey*.</p>
            </div>
        </div>
        
        <div class="container">
            <div class="row" id="etalase-kelas">
                <div class="col-12 text-center text-muted fw-bold">Memuat daftar kelas...</div>
            </div>
        </div>
    </div>

    <!-- TAMPILAN 2: KURIKULUM -->
    <div id="view-kurikulum" class="content-section" style="display: none; padding-top: 0;">
        <div class="header-section mt-0">
            <div class="container">
                <button class="btn btn-sm btn-light fw-bold rounded-pill px-4 py-2 mb-4 shadow-sm border" onclick="kembaliKeKatalog()">🔙 Kembali ke Katalog</button>
                <h1 class="heading-main" id="judul-course">...</h1>
                <p class="fs-5 text-muted mx-auto mb-4" style="max-width: 700px;" id="desc-course">...</p>
                <button id="btn-enroll" class="btn btn-enroll-success mt-2" onclick="ikutiKelas()">➕ Ikuti Kelas & Mulai Hafalkan Kosakata</button>
            </div>
        </div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <h4 class="fw-bold mb-4 text-center">📚 Kurikulum Pembelajaran</h4>
                    <div class="accordion shadow-sm rounded-4" id="kurikulum-accordion"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        let activeCourseId = null;

        if (!TOKEN) window.location.href = "auth.html";

        async function muatKatalog() {
            try {
                const res = await fetch(`${API_URL}/courses`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                const etalase = document.getElementById('etalase-kelas');
                etalase.innerHTML = "";

                if (res.ok && data.courses.length > 0) {
                    data.courses.forEach(course => {
                        let icon = course.thumbnail_url || '📘'; 
                        etalase.innerHTML += `
                            <div class="col-md-6 col-lg-4 mb-4">
                                <div class="card-course" onclick="bukaKurikulum(${course.id})">
                                    <div class="thumbnail-icon">${icon}</div>
                                    <h4 class="fw-bold text-center mb-3">${course.judul_course}</h4>
                                    <p class="text-muted text-center flex-grow-1">${course.deskripsi}</p>
                                    <button class="btn-korisu-solid mt-4 w-100">Lihat Kurikulum</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    etalase.innerHTML = "<h5 class='text-muted text-center w-100'>Belum ada kelas yang tersedia.</h5>";
                }
            } catch (error) {
                document.getElementById('etalase-kelas').innerHTML = "<div class='text-danger text-center w-100'>Gagal terhubung ke server.</div>";
            }
        }

        async function bukaKurikulum(courseId) {
            activeCourseId = courseId; 
            document.getElementById('view-katalog').style.display = 'none';
            document.getElementById('view-kurikulum').style.display = 'block';
            window.scrollTo(0, 0); 
            
            window.history.pushState(null, '', `kelas.html?course_id=${courseId}`);

            document.getElementById('kurikulum-accordion').innerHTML = "<div class='text-center fw-bold py-5'>Menyinkronkan data kurikulum...</div>";

            try {
                const res = await fetch(`${API_URL}/courses/${courseId}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();

                if (res.ok && data.course) {
                    const course = data.course;
                    document.getElementById('judul-course').innerText = course.judul_course;
                    document.getElementById('desc-course').innerText = course.deskripsi;
                    
                    const btnEnroll = document.getElementById('btn-enroll');
                    btnEnroll.innerText = "➕ Ikuti Kelas & Mulai Hafalkan Kosakata";
                    btnEnroll.disabled = false;
                    btnEnroll.classList.remove('btn-secondary');
                    btnEnroll.classList.add('btn-enroll-success');
                    btnEnroll.style.display = 'inline-block'; 

                    const wadah = document.getElementById('kurikulum-accordion');
                    wadah.innerHTML = "";

                    // [PERBAIKAN LOGIKA SRS] Cek apakah backend mengatakan murid sudah daftar
                    if (course.is_enrolled) {
                        btnEnroll.style.display = 'none'; // Sembunyikan karena sudah ikut!
                        
                        try {
                            const srsRes = await fetch(`${API_URL}/srs/today?course_id=${courseId}`, { headers: { 'Authorization': `Bearer ${TOKEN}` }});
                            const srsData = await srsRes.json();
                            
                            if (srsRes.ok) {
                                const jumlahAntrean = srsData.jumlah_antrean || 0;
                                let htmlSrsInfo = "";
                                
                                if (jumlahAntrean > 0) {
                                    htmlSrsInfo = `
                                        <div class="alert alert-warning border border-warning rounded-4 shadow-sm mb-4 d-flex flex-column flex-md-row justify-content-between align-items-center">
                                            <div class="mb-3 mb-md-0 text-center text-md-start">
                                                <h5 class="fw-bold mb-1" style="color: var(--korisu-orange);">🔥 Waktunya Mempertajam Memori!</h5>
                                                <p class="mb-0 text-dark">Ada <strong>${jumlahAntrean} evaluasi 6-Arah</strong> menunggu untuk direview.</p>
                                            </div>
                                            <button class="btn btn-korisu-solid px-4 fs-5" onclick="window.location.href='kuis.html?course_id=${courseId}'">Mulai Kuis 🚀</button>
                                        </div>
                                    `;
                                } else {
                                    htmlSrsInfo = `
                                        <div class="alert alert-success border border-success rounded-4 shadow-sm mb-4 text-center text-md-start">
                                            <h5 class="fw-bold mb-1 text-success">✅ Memori Kelas Ini Aman!</h5>
                                            <p class="mb-0 text-dark">Tidak ada jadwal evaluasi kosakata sekarang. Silakan lanjut menonton video materi.</p>
                                        </div>
                                    `;
                                }
                                wadah.innerHTML = htmlSrsInfo;
                            }
                        } catch (e) { console.log("Gagal memuat info SRS"); }
                    }

                    if(course.modules.length === 0) {
                        wadah.innerHTML += "<div class='alert alert-warning border-0 fw-bold text-center rounded-4 p-4'>Materi untuk kelas ini sedang disiapkan oleh Sensei.</div>";
                        return;
                    }

                    course.modules.forEach((modul, indexModul) => {
                        let htmlLessons = "";
                        modul.lessons.forEach(lesson => {
                            let icon = lesson.tipe_lesson.includes('video') ? '🎥' : '📝';
                            htmlLessons += `
                                <div class="lesson-item" onclick="window.location.href='video-player.html?id=${lesson.id}&course_id=${course.id}'">
                                    <div class="lesson-icon">${icon}</div>
                                    <div class="fw-bold">${lesson.judul_materi}</div>
                                </div>
                            `;
                        });

                        const isFirst = indexModul === 0;
                        const showClass = isFirst ? 'show' : '';
                        const collapsedClass = isFirst ? '' : 'collapsed';

                        wadah.innerHTML += `
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button ${collapsedClass}" type="button" data-bs-toggle="collapse" data-bs-target="#col-${modul.id}">
                                        ${modul.judul_modul}
                                    </button>
                                </h2>
                                <div id="col-${modul.id}" class="accordion-collapse collapse ${showClass}" data-bs-parent="#kurikulum-accordion">
                                    <div class="accordion-body">
                                        ${htmlLessons || '<div class="p-4 text-muted text-center">Materi belum diunggah.</div>'}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                document.getElementById('kurikulum-accordion').innerHTML = "<div class='text-danger text-center p-4'>Gagal memuat kurikulum.</div>";
            }
        }

        async function ikutiKelas() {
            if(!activeCourseId) return;
            const btn = document.getElementById('btn-enroll');
            btn.innerText = "MEMPROSES Pendaftaran...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/courses/${activeCourseId}/enroll`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();
                alert(data.message);

                if (res.ok) {
                    btn.innerText = "✅ Kelas Sudah Diikuti";
                    btn.classList.remove('btn-enroll-success');
                    btn.classList.add('btn-secondary'); 
                    setTimeout(() => bukaKurikulum(activeCourseId), 1000); 
                } else {
                    btn.innerText = "➕ Ikuti Kelas & Mulai Hafalkan Kosakata";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Gagal menghubungi server.");
                btn.innerText = "➕ Ikuti Kelas & Mulai Hafalkan Kosakata";
                btn.disabled = false;
            }
        }

        function kembaliKeKatalog() {
            document.getElementById('view-kurikulum').style.display = 'none';
            document.getElementById('view-katalog').style.display = 'block';
            window.history.pushState(null, '', 'kelas.html'); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            muatKatalog(); 
            const urlParams = new URLSearchParams(window.location.search);
            const autoCourseId = urlParams.get('course_id');
            if (autoCourseId) {
                bukaKurikulum(autoCourseId);
            }
        });
    </script>
</body>
</html>
