<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sensei - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- LIBRARY EDITOR TEKS (QUILL.JS) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #ff7f00;
            --korisu-black: #1a1a1a;
            --korisu-white: #ffffff;
        }
        body { background-color: #fafafa; color: var(--korisu-black); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-custom { background-color: var(--korisu-orange); padding: 15px 0; }
        .btn-nav-outline { background-color: var(--korisu-white); color: var(--korisu-orange); font-weight: bold; border-radius: 25px; padding: 8px 25px; border: none; transition: all 0.2s; }
        .btn-nav-outline:hover { background-color: #f8f9fa; transform: translateY(-2px); }
        .content-section { flex: 1; background-image: radial-gradient(#e0e0e0 2px, transparent 2px); background-size: 30px 30px; padding: 40px 0 60px 0; }
        .header-section { background-color: var(--korisu-white); padding: 40px 0; text-align: center; border-bottom: 1px solid #f0f0f0; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .badge-atas { display: inline-block; background-color: #fffaf5; color: var(--korisu-orange); font-weight: 700; font-size: 0.85rem; padding: 8px 16px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #ffe8d6; }
        
        .card-panel { background-color: var(--korisu-white); border: 1px solid #f0f0f0; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); padding: 30px; height: 100%; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .card-panel:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .form-control, .form-select { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 12px; padding: 12px 15px; }
        .form-control:focus, .form-select:focus { border-color: var(--korisu-orange); box-shadow: 0 0 0 0.25rem rgba(255, 127, 0, 0.15); background-color: var(--korisu-white); }
        .instruksi-box { background-color: #fffaf5; border-left: 4px solid var(--korisu-orange); padding: 15px; font-size: 0.9rem; border-radius: 8px; }
        
        .btn-korisu-solid { background-color: var(--korisu-black); color: white; border: none; border-radius: 12px; font-weight: bold; padding: 12px 20px; transition: all 0.3s; width: 100%; }
        .btn-korisu-solid:hover:not(:disabled) { background-color: var(--korisu-orange); color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 127, 0, 0.25); }
        .btn-edit-mode { background-color: #084298; color: white; }
        .btn-edit-mode:hover:not(:disabled) { background-color: #052c65; box-shadow: 0 8px 20px rgba(8, 66, 152, 0.25); }

        /* Styling Khusus Editor Teks Quill */
        .ql-toolbar.ql-snow { border: 1px solid #dee2e6; border-top-left-radius: 12px; border-top-right-radius: 12px; background-color: #f8f9fa; }
        .ql-container.ql-snow { border: 1px solid #dee2e6; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 1rem; }
        .ql-editor { min-height: 120px; }
        .ql-editor:focus { background-color: var(--korisu-white); border-color: var(--korisu-orange); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="dashboard.html">
                <div style="background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">👨‍🏫</div>
                <span class="d-none d-sm-inline">Ruang Sensei</span>
            </a>
            <button class="btn-nav-outline" onclick="window.location.href='dashboard.html'">Kembali ke Dasbor</button>
        </div>
    </nav>

    <div class="header-section mt-0">
        <div class="container">
            <div class="badge-atas">⚙️ Pusat Kendali Admin</div>
            <h2 class="fw-bold text-dark mb-2">Panel <span style="color: var(--korisu-orange);">Sensei</span></h2>
            <p class="text-muted">Kelola kurikulum, revisi materi, dan lengkapi deskripsi video dari satu tempat.</p>
        </div>
    </div>

    <div class="content-section">
        <div class="container">
            <div class="row">
                
                <!-- 1. Form Tambah Kelas Baru -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">🎓 1. Buat Kelas Baru</h4>
                        <form id="form-course" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Kelas</label>
                                <input type="text" id="c-judul" class="form-control" placeholder="Contoh: Persiapan Kaigo Kokka Shiken" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Ikon Thumbnail (Emoji)</label>
                                <input type="text" id="c-thumb" class="form-control" placeholder="Contoh: ⛩️ atau 🌸" required>
                            </div>
                            <div class="mb-4 flex-grow-1 d-flex flex-column">
                                <label class="form-label fw-bold text-dark">Deskripsi Kelas</label>
                                <textarea id="c-desc" class="form-control flex-grow-1" style="min-height: 80px;" placeholder="Tuliskan deskripsi singkat..." required></textarea>
                            </div>
                            <button type="submit" id="btn-submit-course" class="btn-korisu-solid mt-auto">TERBITKAN KELAS</button>
                        </form>
                    </div>
                </div>

                <!-- 2. Form Tambah Modul -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">📂 2. Tambah Modul Kurikulum</h4>
                        <form id="form-module" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Pilih Kelas</label>
                                <select id="m-course-id" class="form-select fw-medium dropdown-kelas" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Modul</label>
                                <input type="text" id="m-judul" class="form-control" placeholder="Contoh: Modul 1: Pengenalan Lansia" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Urutan Modul (Angka)</label>
                                <input type="number" id="m-urutan" class="form-control" placeholder="Contoh: 1" required>
                            </div>
                            <button type="submit" id="btn-submit-module" class="btn-korisu-solid mt-auto">SIMPAN MODUL</button>
                        </form>
                    </div>
                </div>

                <!-- 3. Form Tambah Materi / Lesson (DILENGKAPI EDITOR TEKS) -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">🎥 3. Unggah Materi Baru</h4>
                        <form id="form-lesson" class="d-flex flex-column flex-grow-1">
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Pilih Kelas</label>
                                    <select class="form-select fw-medium dropdown-kelas" onchange="muatDropdownModul(this.value, 'l-module-id')" required></select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Pilih Modul</label>
                                    <select id="l-module-id" class="form-select fw-medium" required>
                                        <option value="">Pilih kelas dulu...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Materi</label>
                                <input type="text" id="l-judul" class="form-control" placeholder="Contoh: Tata Cara..." required>
                            </div>
                            
                            <!-- AREA EDITOR TEKS (BARU) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Catatan / Rangkuman Sensei</label>
                                <div>
                                    <div id="l-desc-editor"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">URL Konten (Embed YouTube)</label>
                                <input type="text" id="l-url" class="form-control" placeholder="https://www.youtube.com/embed/... " required>
                            </div>
                            <div class="row mb-4">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Tipe</label>
                                    <select id="l-tipe" class="form-select">
                                        <option value="video">Video</option>
                                        <option value="teks">Teks Bacaan</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Urutan</label>
                                    <input type="number" id="l-urutan" class="form-control" placeholder="1" required>
                                </div>
                            </div>
                            <button type="submit" id="btn-submit-lesson" class="btn-korisu-solid mt-auto">SIMPAN MATERI BARU</button>
                        </form>
                    </div>
                </div>

                <!-- 4. Form EDIT MATERI (DILENGKAPI EDITOR TEKS) -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel border-primary" style="border-width: 2px;">
                        <h4 class="fw-bold mb-4 text-primary">✏️ 4. Edit Materi & Deskripsi</h4>
                        <form id="form-edit-lesson" class="d-flex flex-column flex-grow-1">
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">1. Pilih Kelas</label>
                                    <select class="form-select fw-medium dropdown-kelas" onchange="muatDropdownModul(this.value, 'el-module-id')" required></select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">2. Pilih Modul</label>
                                    <select id="el-module-id" class="form-select fw-medium" onchange="muatDropdownLesson(this.value, 'el-lesson-id')" required>
                                        <option value="">Pilih kelas dulu...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">3. Pilih Materi yang mau diedit</label>
                                <select id="el-lesson-id" class="form-select fw-medium border-primary" onchange="tarikDataLesson(this.value)" required>
                                    <option value="">Pilih modul dulu...</option>
                                </select>
                            </div>
                            <hr class="mb-3">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Revisi Judul Materi</label>
                                <input type="text" id="el-judul" class="form-control" required>
                            </div>
                            
                            <!-- AREA EDITOR TEKS (BARU) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Revisi Catatan / Rangkuman</label>
                                <div>
                                    <div id="el-desc-editor"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Revisi URL Konten</label>
                                <input type="text" id="el-url" class="form-control" required>
                            </div>
                            <div class="row mb-4">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Tipe</label>
                                    <select id="el-tipe" class="form-select">
                                        <option value="video">Video</option>
                                        <option value="teks">Teks Bacaan</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Urutan</label>
                                    <input type="number" id="el-urutan" class="form-control" required>
                                </div>
                            </div>
                            <button type="submit" id="btn-submit-edit-lesson" class="btn-korisu-solid btn-edit-mode mt-auto">UPDATE MATERI</button>
                        </form>
                    </div>
                </div>

                <!-- 5. Form EDIT MODUL -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel border-primary" style="border-width: 2px;">
                        <h4 class="fw-bold mb-4 text-primary">✏️ 5. Revisi Nama Modul</h4>
                        <form id="form-edit-module" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Pilih Kelas</label>
                                <select class="form-select fw-medium dropdown-kelas" onchange="muatDropdownModul(this.value, 'em-module-id')" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Pilih Modul yang mau direvisi</label>
                                <select id="em-module-id" class="form-select fw-medium border-primary" required>
                                    <option value="">Pilih kelas dulu...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Modul Baru</label>
                                <input type="text" id="em-judul" class="form-control" placeholder="Ketik nama pengganti..." required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Urutan Modul Baru</label>
                                <input type="number" id="em-urutan" class="form-control" placeholder="1" required>
                            </div>
                            <button type="submit" id="btn-submit-edit-module" class="btn-korisu-solid btn-edit-mode mt-auto">UPDATE MODUL</button>
                        </form>
                    </div>
                </div>

                <!-- 6. Form Tambah Kosakata MASAL -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-3 text-dark">📚 6. Tambah Kosakata Masal</h4>
                        <form id="form-vocab-bulk" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Pilih Kelas Target</label>
                                <select id="v-course-id" class="form-select fw-medium dropdown-kelas" required></select>
                            </div>
                            <div class="mb-4 flex-grow-1 d-flex flex-column">
                                <label class="form-label fw-bold text-dark">Data Kosakata (Kanji, Furigana, Arti)</label>
                                <textarea id="v-bulk-input" class="form-control flex-grow-1" style="min-height: 120px;" placeholder="食べる, たべる, Makan" required></textarea>
                            </div>
                            <button type="submit" id="btn-submit-vocab" class="btn-korisu-solid mt-auto">SIMPAN KOSAKATA</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- PANGGIL LIBRARY SCRIPT QUILL.JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        const USER = JSON.parse(localStorage.getItem('korisu_user') || '{}');

        if (!TOKEN || USER.role !== 'sensei') window.location.href = "dashboard.html";

        // MENGAKTIFKAN EDITOR TEKS
        const opsiEditor = [
            ['bold', 'italic', 'underline'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['clean']
        ];
        
        const editorMateriBaru = new Quill('#l-desc-editor', { theme: 'snow', modules: { toolbar: opsiEditor }, placeholder: 'Ketik materi di sini...' });
        const editorMateriLama = new Quill('#el-desc-editor', { theme: 'snow', modules: { toolbar: opsiEditor }, placeholder: 'Revisi materi di sini...' });

        // Fungsi Universal: Memuat Dropdown Kelas
        async function muatDropdownKatalogUniversal() {
            try {
                const res = await fetch(`${API_URL}/courses`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                const selects = document.querySelectorAll('.dropdown-kelas');
                selects.forEach(select => {
                    select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
                    if (res.ok && data.courses.length > 0) {
                        data.courses.forEach(course => { select.innerHTML += `<option value="${course.id}">${course.judul_course}</option>`; });
                    }
                });
            } catch (error) { console.error(error); }
        }

        // Fungsi Dinamis: Memuat Modul ke Target Dropdown Spesifik
        async function muatDropdownModul(courseId, targetId) {
            const selectModul = document.getElementById(targetId);
            if(!courseId) { selectModul.innerHTML = '<option value="">Pilih kelas dulu...</option>'; return; }
            
            selectModul.innerHTML = '<option value="">⏳ Memuat...</option>';
            try {
                const res = await fetch(`${API_URL}/courses/${courseId}/modules`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                selectModul.innerHTML = '<option value="">-- Pilih Modul --</option>';
                if(res.ok && data.modules.length > 0) {
                    data.modules.forEach(mod => { selectModul.innerHTML += `<option value="${mod.id}">${mod.judul_modul}</option>`; });
                } else selectModul.innerHTML = '<option value="">Belum ada modul</option>';
            } catch (error) { selectModul.innerHTML = '<option value="">Gagal memuat</option>'; }
        }

        // Fungsi Dinamis: Memuat Lesson untuk Form Edit
        async function muatDropdownLesson(moduleId, targetId) {
            const selectLesson = document.getElementById(targetId);
            if(!moduleId) { selectLesson.innerHTML = '<option value="">Pilih modul dulu...</option>'; return; }
            
            selectLesson.innerHTML = '<option value="">⏳ Memuat...</option>';
            try {
                const res = await fetch(`${API_URL}/courses/modules/${moduleId}/lessons`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                selectLesson.innerHTML = '<option value="">-- Pilih Materi --</option>';
                if(res.ok && data.lessons.length > 0) {
                    data.lessons.forEach(les => { selectLesson.innerHTML += `<option value="${les.id}">${les.judul_materi}</option>`; });
                } else selectLesson.innerHTML = '<option value="">Belum ada materi</option>';
            } catch (error) { selectLesson.innerHTML = '<option value="">Gagal memuat</option>'; }
        }

        // Fungsi Dinamis: Menarik Data Lama ke dalam Form Edit Materi (TERMASUK EDITOR)
        async function tarikDataLesson(lessonId) {
            if(!lessonId) return;
            try {
                const res = await fetch(`${API_URL}/lessons/${lessonId}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                if(res.ok && data.lesson) {
                    document.getElementById('el-judul').value = data.lesson.judul_materi;
                    document.getElementById('el-url').value = data.lesson.konten_url;
                    document.getElementById('el-tipe').value = data.lesson.tipe_lesson;
                    document.getElementById('el-urutan').value = data.lesson.urutan_lesson;
                    
                    // Memasukkan teks lama ke dalam Editor Teks
                    editorMateriLama.root.innerHTML = data.lesson.deskripsi || '';
                }
            } catch (error) { alert("Gagal menarik data materi lama dari server."); }
        }

        // -- SUBMIT EDIT MATERI --
        document.getElementById('form-edit-lesson').addEventListener('submit', async (e) => {
            e.preventDefault();
            const lesId = document.getElementById('el-lesson-id').value;
            if(!lesId) return alert("Harap pilih materi yang ingin diedit terlebih dahulu.");
            
            let deskripsiKonten = editorMateriLama.root.innerHTML;
            if (deskripsiKonten === '<p><br></p>') deskripsiKonten = '';

            const btn = document.getElementById('btn-submit-edit-lesson'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/lessons/${lesId}/edit`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ 
                        judul_materi: document.getElementById('el-judul').value, 
                        deskripsi: deskripsiKonten,
                        konten_url: document.getElementById('el-url').value, 
                        tipe_lesson: document.getElementById('el-tipe').value, 
                        urutan_lesson: parseInt(document.getElementById('el-urutan').value) 
                    })
                });
                const result = await res.json();
                if(res.ok) { alert(result.message); document.getElementById('form-edit-lesson').reset(); editorMateriLama.root.innerHTML = ''; } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT EDIT MODUL --
        document.getElementById('form-edit-module').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modId = document.getElementById('em-module-id').value;
            if(!modId) return alert("Harap pilih modul yang ingin direvisi terlebih dahulu.");

            const btn = document.getElementById('btn-submit-edit-module'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/modules/${modId}/edit`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ judul_modul: document.getElementById('em-judul').value, urutan_modul: parseInt(document.getElementById('em-urutan').value) })
                });
                const result = await res.json();
                if(res.ok) { alert(result.message); document.getElementById('form-edit-module').reset(); } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUMBIT KELAS BARU --
        document.getElementById('form-course').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-course'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ judul_course: document.getElementById('c-judul').value, thumbnail_url: document.getElementById('c-thumb').value, deskripsi: document.getElementById('c-desc').value })
                });
                const result = await res.json();
                if(res.ok) { alert("✅ " + result.message); document.getElementById('form-course').reset(); muatDropdownKatalogUniversal(); } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT MATERI BARU (DENGAN EDITOR TEKS) --
        document.getElementById('form-lesson').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let deskripsiKonten = editorMateriBaru.root.innerHTML;
            if (deskripsiKonten === '<p><br></p>') deskripsiKonten = '';

            const btn = document.getElementById('btn-submit-lesson'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/lessons/add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ 
                        module_id: document.getElementById('l-module-id').value, 
                        judul_materi: document.getElementById('l-judul').value, 
                        deskripsi: deskripsiKonten, 
                        konten_url: document.getElementById('l-url').value, 
                        tipe_lesson: document.getElementById('l-tipe').value, 
                        urutan_lesson: parseInt(document.getElementById('l-urutan').value) 
                    })
                });
                const result = await res.json();
                if(res.ok) { alert("✅ " + result.message); document.getElementById('form-lesson').reset(); editorMateriBaru.root.innerHTML = ''; } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT MODUL BARU --
        document.getElementById('form-module').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-module'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/modules/add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ course_id: document.getElementById('m-course-id').value, judul_modul: document.getElementById('m-judul').value, urutan_modul: parseInt(document.getElementById('m-urutan').value) })
                });
                const result = await res.json();
                if(res.ok) { alert("✅ " + result.message); document.getElementById('m-judul').value = ""; document.getElementById('m-urutan').value = ""; } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT KOSAKATA MASAL --
        document.getElementById('form-vocab-bulk').addEventListener('submit', async (e) => {
            e.preventDefault();
            const courseId = document.getElementById('v-course-id').value;
            const rawData = document.getElementById('v-bulk-input').value;
            if(!courseId) return alert("Pilih kelas!");
            const arrayKosakata = rawData.split('\n').map(b => b.trim()).filter(b => b).map(b => {
                const k = b.split(','); return k.length >= 3 ? { kanji: k[0].trim(), furigana: k[1].trim(), arti_indonesia: k[2].trim() } : null;
            });
            if(arrayKosakata.includes(null)) return alert("Format salah. Harus dipisah koma!");
            
            const btn = document.getElementById('btn-submit-vocab'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/vocabulary/bulk-add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ vocabularies: arrayKosakata, course_id: courseId })
                });
                if(res.ok) { alert("✅ Kosakata disimpan!"); document.getElementById('v-bulk-input').value = ""; }
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        document.addEventListener('DOMContentLoaded', muatDropdownKatalogUniversal);
    </script>
</body>
</html>
