<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sensei - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
        }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar-korisu { background-color: var(--korisu-orange); }
        .card-custom { border: 2px solid var(--korisu-black); box-shadow: 4px 4px 0px var(--korisu-black); }
        .btn-korisu { background-color: var(--korisu-black); color: white; border: 2px solid var(--korisu-black); font-weight: bold; }
        .btn-korisu:hover { background-color: var(--korisu-orange); color: var(--korisu-black); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-korisu shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🐿️ KORISU Gakkou - Ruang Sensei</a>
            <button class="btn btn-sm btn-light fw-bold" onclick="kembali()">Kembali ke Dashboard</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <!-- Form Tambah Kosakata -->
            <div class="col-md-6 mb-4">
                <div class="card card-custom p-4">
                    <h4 class="fw-bold mb-4">📚 Tambah Kosakata Kaigo</h4>
                    <form id="form-vocab">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kanji</label>
                            <input type="text" id="v-kanji" class="form-control" placeholder="Contoh: 車椅子" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Furigana (Cara Baca)</label>
                            <input type="text" id="v-furigana" class="form-control" placeholder="Contoh: くるまいす" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Arti Indonesia</label>
                            <input type="text" id="v-arti" class="form-control" placeholder="Contoh: Kursi roda" required>
                        </div>
                        <button type="submit" class="btn btn-korisu w-100">SIMPAN KOSAKATA</button>
                    </form>
                </div>
            </div>

            <!-- Form Tambah Quote -->
            <div class="col-md-6 mb-4">
                <div class="card card-custom p-4">
                    <h4 class="fw-bold mb-4">🌸 Tambah Pepatah Motivasi</h4>
                    <form id="form-quote">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teks Jepang</label>
                            <input type="text" id="q-teks" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Cara Baca Romaji</label>
                            <input type="text" id="q-baca" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Arti Indonesia</label>
                            <input type="text" id="q-arti" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Tokoh</label>
                                <input type="text" id="q-tokoh" class="form-control" placeholder="Anonim">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Kategori</label>
                                <input type="text" id="q-kategori" class="form-control" placeholder="motivasi">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-korisu w-100">SIMPAN PEPATAH</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        const USER = JSON.parse(localStorage.getItem('korisu_user') || '{}');

        // SATPAM HALAMAN: Usir jika bukan Sensei
        if (!TOKEN || USER.role !== 'sensei') {
            alert("Akses Ditolak! Halaman ini khusus untuk Sensei.");
            window.location.href = "dashboard.html";
        }

        function kembali() { window.location.href = "dashboard.html"; }

        // MENGIRIM DATA QUOTE
        document.getElementById('form-quote').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dataQuote = {
                teks_jepang: document.getElementById('q-teks').value,
                cara_baca: document.getElementById('q-baca').value,
                arti_indonesia: document.getElementById('q-arti').value,
                sumber_tokoh: document.getElementById('q-tokoh').value || 'Sensei',
                kategori_fokus: document.getElementById('q-kategori').value || 'motivasi'
            };

            try {
                const res = await fetch(`${API_URL}/quotes/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify(dataQuote)
                });
                const result = await res.json();
                if(res.ok) {
                    alert("✅ Quote berhasil ditambahkan!");
                    document.getElementById('form-quote').reset();
                } else alert("Gagal: " + result.message);
            } catch (err) { alert("Error jaringan."); }
        });

        // MENGIRIM DATA KOSAKATA
        document.getElementById('form-vocab').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dataVocab = {
                kanji: document.getElementById('v-kanji').value,
                furigana: document.getElementById('v-furigana').value,
                arti_indonesia: document.getElementById('v-arti').value
            };

            try {
                const res = await fetch(`${API_URL}/vocabulary/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify(dataVocab)
                });
                const result = await res.json();
                if(res.ok) {
                    alert("✅ Kosakata Kaigo berhasil ditambahkan!");
                    document.getElementById('form-vocab').reset();
                } else alert("Gagal: " + result.message);
            } catch (err) { alert("Error jaringan."); }
        });
    </script>
</body>
</html>
