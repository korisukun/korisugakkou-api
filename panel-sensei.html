<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sensei - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --korisu-orange: #ff7f00;
            --korisu-black: #1a1a1a;
            --korisu-white: #ffffff;
        }
        body { 
            background-color: #fafafa; 
            color: var(--korisu-black); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .navbar-custom { background-color: var(--korisu-orange); padding: 15px 0; }
        .btn-nav-outline { background-color: var(--korisu-white); color: var(--korisu-orange); font-weight: bold; border-radius: 25px; padding: 8px 25px; border: none; transition: all 0.2s; }
        .btn-nav-outline:hover { background-color: #f8f9fa; transform: translateY(-2px); }
        .content-section { flex: 1; background-image: radial-gradient(#e0e0e0 2px, transparent 2px); background-size: 30px 30px; padding: 40px 0 60px 0; }
        .header-section { background-color: var(--korisu-white); padding: 40px 0; text-align: center; border-bottom: 1px solid #f0f0f0; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .badge-atas { display: inline-block; background-color: #fffaf5; color: var(--korisu-orange); font-weight: 700; font-size: 0.85rem; padding: 8px 16px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #ffe8d6; }
        
        .card-panel { background-color: var(--korisu-white); border: 1px solid #f0f0f0; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); padding: 30px; height: 100%; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        .card-panel:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .form-control, .form-select { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 12px; padding: 12px 15px; }
        .form-control:focus, .form-select:focus { border-color: var(--korisu-orange); box-shadow: 0 0 0 0.25rem rgba(255, 127, 0, 0.15); background-color: var(--korisu-white); }
        .instruksi-box { background-color: #fffaf5; border-left: 4px solid var(--korisu-orange); padding: 15px; font-size: 0.9rem; border-radius: 8px; }
        
        .btn-korisu-solid { background-color: var(--korisu-black); color: white; border: none; border-radius: 12px; font-weight: bold; padding: 12px 20px; transition: all 0.3s; width: 100%; }
        .btn-korisu-solid:hover:not(:disabled) { background-color: var(--korisu-orange); color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 127, 0, 0.25); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="dashboard.html">
                <div style="background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">👨‍🏫</div>
                <span class="d-none d-sm-inline">Ruang Sensei</span>
            </a>
            <button class="btn-nav-outline" onclick="window.location.href='dashboard.html'">Kembali ke Dasbor</button>
        </div>
    </nav>

    <div class="header-section mt-0">
        <div class="container">
            <div class="badge-atas">⚙️ Pusat Kendali Admin</div>
            <h2 class="fw-bold text-dark mb-2">Panel <span style="color: var(--korisu-orange);">Sensei</span></h2>
            <p class="text-muted">Kelola kurikulum, kelas, materi video, kosakata, dan item toko.</p>
        </div>
    </div>

    <div class="content-section">
        <div class="container">
            <div class="row">
                
                <!-- 1. Form Tambah Kelas Baru -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">🎓 1. Buat Kelas Baru</h4>
                        <form id="form-course" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Kelas</label>
                                <input type="text" id="c-judul" class="form-control" placeholder="Contoh: Persiapan Kaigo Kokka Shiken" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Ikon Thumbnail (Emoji)</label>
                                <input type="text" id="c-thumb" class="form-control" placeholder="Contoh: ⛩️ atau 🌸" required>
                            </div>
                            <div class="mb-4 flex-grow-1 d-flex flex-column">
                                <label class="form-label fw-bold text-dark">Deskripsi Kelas</label>
                                <textarea id="c-desc" class="form-control flex-grow-1" style="min-height: 80px;" placeholder="Tuliskan deskripsi singkat..." required></textarea>
                            </div>
                            <button type="submit" id="btn-submit-course" class="btn-korisu-solid mt-auto">TERBITKAN KELAS</button>
                        </form>
                    </div>
                </div>

                <!-- 2. Form Tambah Modul -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">📂 2. Tambah Modul Kurikulum</h4>
                        <form id="form-module" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Pilih Kelas</label>
                                <select id="m-course-id" class="form-select fw-medium dropdown-kelas" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Modul</label>
                                <input type="text" id="m-judul" class="form-control" placeholder="Contoh: Modul 1: Pengenalan Lansia" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Urutan Modul (Angka)</label>
                                <input type="number" id="m-urutan" class="form-control" placeholder="Contoh: 1" required>
                            </div>
                            <button type="submit" id="btn-submit-module" class="btn-korisu-solid mt-auto">SIMPAN MODUL</button>
                        </form>
                    </div>
                </div>

                <!-- 3. Form Tambah Materi / Lesson -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">🎥 3. Unggah Materi (Video/Teks)</h4>
                        <form id="form-lesson" class="d-flex flex-column flex-grow-1">
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Pilih Kelas</label>
                                    <select id="l-course-id" class="form-select fw-medium dropdown-kelas" onchange="muatDropdownModul(this.value)" required></select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Pilih Modul</label>
                                    <select id="l-module-id" class="form-select fw-medium" required>
                                        <option value="">Pilih kelas dulu...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Judul Materi</label>
                                <input type="text" id="l-judul" class="form-control" placeholder="Contoh: Tata Cara Mengangkat Pasien" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">URL Konten (Embed YouTube)</label>
                                <input type="text" id="l-url" class="form-control" placeholder="https://www.youtube.com/embed/... " required>
                            </div>
                            <div class="row mb-4">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Tipe</label>
                                    <select id="l-tipe" class="form-select">
                                        <option value="video">Video</option>
                                        <option value="text">Teks Bacaan</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Urutan</label>
                                    <input type="number" id="l-urutan" class="form-control" placeholder="Contoh: 1" required>
                                </div>
                            </div>
                            <button type="submit" id="btn-submit-lesson" class="btn-korisu-solid mt-auto">SIMPAN MATERI</button>
                        </form>
                    </div>
                </div>

                <!-- 4. Form Tambah Kosakata MASAL -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-3 text-dark">📚 4. Tambah Kosakata Masal</h4>
                        <form id="form-vocab-bulk" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Pilih Kelas Target</label>
                                <select id="v-course-id" class="form-select fw-medium dropdown-kelas" required></select>
                            </div>
                            <div class="mb-4 flex-grow-1 d-flex flex-column">
                                <label class="form-label fw-bold text-dark">Data Kosakata (Kanji, Furigana, Arti)</label>
                                <textarea id="v-bulk-input" class="form-control flex-grow-1" style="min-height: 120px;" placeholder="食べる, たべる, Makan" required></textarea>
                            </div>
                            <button type="submit" id="btn-submit-vocab" class="btn-korisu-solid mt-auto">SIMPAN KOSAKATA</button>
                        </form>
                    </div>
                </div>

                <!-- 5. Form Tambah Item Toko -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">🏪 5. Tambah Item Toko</h4>
                        <form id="form-shop" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Nama Item</label>
                                <input type="text" id="s-nama" class="form-control" placeholder="Contoh: Dorayaki Coklat" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Tipe Item</label>
                                    <select id="s-tipe" class="form-select" required>
                                        <option value="makanan">Makanan (+Mood)</option>
                                        <option value="aksesoris">Aksesoris Maskot</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold text-dark">Harga (Koin)</label>
                                    <input type="number" id="s-harga" class="form-control" placeholder="15" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Ikon Emoji</label>
                                <input type="text" id="s-ikon" class="form-control" placeholder="Contoh: 🥞" required>
                            </div>
                            <button type="submit" id="btn-submit-shop" class="btn-korisu-solid mt-auto">MASUKKAN KE ETALASE</button>
                        </form>
                    </div>
                </div>

                <!-- 6. Form Tambah Quote -->
                <div class="col-lg-6 mb-4">
                    <div class="card-panel">
                        <h4 class="fw-bold mb-4 text-dark">🌸 6. Tambah Pepatah</h4>
                        <form id="form-quote" class="d-flex flex-column flex-grow-1">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Teks Jepang</label>
                                <input type="text" id="q-teks" class="form-control" placeholder="頑張って" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Arti Indonesia</label>
                                <input type="text" id="q-arti" class="form-control" placeholder="Semangat!" required>
                            </div>
                            <button type="submit" id="btn-submit-quote" class="btn-korisu-solid mt-auto">SIMPAN PEPATAH</button>
                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        const USER = JSON.parse(localStorage.getItem('korisu_user') || '{}');

        if (!TOKEN || USER.role !== 'sensei') window.location.href = "dashboard.html";

        // Fungsi Universal: Memuat Dropdown Kelas ke semua Form yang butuh
        async function muatDropdownKatalogUniversal() {
            try {
                const res = await fetch(`${API_URL}/courses`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                
                const selects = document.querySelectorAll('.dropdown-kelas');
                selects.forEach(select => {
                    select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
                    if (res.ok && data.courses.length > 0) {
                        data.courses.forEach(course => {
                            select.innerHTML += `<option value="${course.id}">${course.judul_course}</option>`;
                        });
                    }
                });
            } catch (error) { console.error(error); }
        }

        // Fungsi Dinamis: Memuat Dropdown Modul saat Kelas Dipilih
        async function muatDropdownModul(courseId) {
            const selectModul = document.getElementById('l-module-id');
            if(!courseId) { selectModul.innerHTML = '<option value="">Pilih kelas dulu...</option>'; return; }
            
            selectModul.innerHTML = '<option value="">⏳ Memuat...</option>';
            try {
                const res = await fetch(`${API_URL}/courses/${courseId}/modules`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                const data = await res.json();
                selectModul.innerHTML = '<option value="">-- Pilih Modul --</option>';
                if(res.ok && data.modules.length > 0) {
                    data.modules.forEach(mod => { selectModul.innerHTML += `<option value="${mod.id}">${mod.judul_modul}</option>`; });
                } else {
                    selectModul.innerHTML = '<option value="">Belum ada modul, buat dulu!</option>';
                }
            } catch (error) { selectModul.innerHTML = '<option value="">Gagal memuat modul</option>'; }
        }

        // -- SUMBIT KELAS --
        document.getElementById('form-course').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-course'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ judul_course: document.getElementById('c-judul').value, thumbnail_url: document.getElementById('c-thumb').value, deskripsi: document.getElementById('c-desc').value })
                });
                const result = await res.json();
                if(res.ok) { alert("✅ " + result.message); document.getElementById('form-course').reset(); muatDropdownKatalogUniversal(); } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT MODUL --
        document.getElementById('form-module').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-module'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/modules/add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ course_id: document.getElementById('m-course-id').value, judul_modul: document.getElementById('m-judul').value, urutan_modul: parseInt(document.getElementById('m-urutan').value) })
                });
                const result = await res.json();
                if(res.ok) { alert("✅ " + result.message); document.getElementById('m-judul').value = ""; document.getElementById('m-urutan').value = ""; } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT LESSON --
        document.getElementById('form-lesson').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-lesson'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/courses/lessons/add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ module_id: document.getElementById('l-module-id').value, judul_materi: document.getElementById('l-judul').value, konten_url: document.getElementById('l-url').value, tipe_lesson: document.getElementById('l-tipe').value, urutan_lesson: parseInt(document.getElementById('l-urutan').value) })
                });
                const result = await res.json();
                if(res.ok) { alert("✅ " + result.message); document.getElementById('l-judul').value = ""; document.getElementById('l-url').value = ""; } else alert(result.message);
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT KOSAKATA (Dipertahankan) --
        document.getElementById('form-vocab-bulk').addEventListener('submit', async (e) => {
            e.preventDefault();
            const courseId = document.getElementById('v-course-id').value;
            const rawData = document.getElementById('v-bulk-input').value;
            if(!courseId) return alert("Pilih kelas!");
            const arrayKosakata = rawData.split('\n').map(b => b.trim()).filter(b => b).map(b => {
                const k = b.split(','); return k.length >= 3 ? { kanji: k[0].trim(), furigana: k[1].trim(), arti_indonesia: k[2].trim() } : null;
            });
            if(arrayKosakata.includes(null)) return alert("Format ada yang salah. Harus dipisah koma!");
            
            const btn = document.getElementById('btn-submit-vocab'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/vocabulary/bulk-add`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                    body: JSON.stringify({ vocabularies: arrayKosakata, course_id: courseId })
                });
                if(res.ok) { alert("✅ Kosakata berhasil disimpan!"); document.getElementById('v-bulk-input').value = ""; }
            } catch (err) { alert("Error jaringan"); } finally { btn.disabled = false; }
        });

        // -- SUBMIT SHOP & QUOTE (Dipertahankan seperti sebelumnya) --
        document.getElementById('form-shop').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/shop/add`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                body: JSON.stringify({ nama_item: document.getElementById('s-nama').value, tipe_item: document.getElementById('s-tipe').value, harga_koin: parseInt(document.getElementById('s-harga').value), image_url: document.getElementById('s-ikon').value }) });
                if(res.ok) { alert("✅ Item toko berhasil ditambahkan!"); document.getElementById('form-shop').reset(); }
            } catch(e){}
        });

        document.getElementById('form-quote').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/quotes/add`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
                body: JSON.stringify({ teks_jepang: document.getElementById('q-teks').value, arti_indonesia: document.getElementById('q-arti').value, sumber_tokoh: "Sensei", kategori_fokus: "motivasi" }) });
                if(res.ok) { alert("✅ Quote berhasil ditambahkan!"); document.getElementById('form-quote').reset(); }
            } catch(e){}
        });

        document.addEventListener('DOMContentLoaded', muatDropdownKatalogUniversal);
    </script>
</body>
</html>
