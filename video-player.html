<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Materi - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #ff7f00;
            --korisu-black: #1a1a1a;
            --korisu-white: #ffffff;
        }
        
        body { 
            background-color: #fafafa; 
            color: var(--korisu-black); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigasi Atas (Solid Orange) */
        .navbar-custom { 
            background-color: var(--korisu-orange); 
            padding: 15px 0;
        }
        .btn-nav-outline {
            background-color: var(--korisu-white);
            color: var(--korisu-orange);
            font-weight: bold;
            border-radius: 25px;
            padding: 8px 25px;
            border: none;
            transition: all 0.2s;
        }
        .btn-nav-outline:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }

        /* Area Konten Utama (Dotted Grid Background) */
        .content-section {
            flex: 1;
            background-image: radial-gradient(#e0e0e0 2px, transparent 2px);
            background-size: 30px 30px;
            padding: 40px 0 60px 0;
        }

        /* Kartu Pemutar (Soft Shadow, Rounded) */
        .card-modern {
            background-color: var(--korisu-white);
            border: 1px solid #f0f0f0;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            padding: 30px;
        }

        /* Container Video YouTube */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Area Tugas & Tombol */
        .task-box {
            background-color: #fffaf5;
            border: 1px solid #ffe8d6;
            border-radius: 16px;
            padding: 20px;
        }
        
        .btn-selesai-modern { 
            background-color: #198754; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 800; 
            padding: 12px 25px; 
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.2);
        }
        .btn-selesai-modern:hover:not(:disabled) { 
            background-color: #146c43; 
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(25, 135, 84, 0.3);
        }
        .btn-selesai-modern:disabled {
            background-color: #6c757d;
            box-shadow: none;
        }

        /* Badge Kecil */
        .badge-kategori {
            display: inline-block;
            background-color: #fffaf5;
            color: var(--korisu-orange);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid #ffe8d6;
        }

        /* Styling Modal Sukses */
        .modal-content-modern {
            border: none;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        .btn-korisu-solid { 
            background-color: var(--korisu-orange); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            padding: 12px 20px; 
            transition: all 0.3s; 
        }
        .btn-korisu-solid:hover { 
            background-color: #e67300; 
            color: white; 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(255, 127, 0, 0.25); 
        }
    </style>
</head>
<body>

    <!-- Navigasi Atas Minimalis -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="kelas.html">
                <div style="background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">🐿️</div>
                <span class="d-none d-sm-inline">Ruang Putar Video</span>
            </a>
            <button class="btn-nav-outline" onclick="window.location.href='kelas.html'">🔙 Kembali ke Kurikulum</button>
        </div>
    </nav>

    <!-- Konten Pemutar Video -->
    <div class="content-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    
                    <div class="card-modern">
                        <span class="badge-kategori">🎥 Video Pembelajaran</span>
                        <h2 class="fw-bold mb-4 text-dark" id="judul-materi">Memuat Video...</h2>
                        
                        <div class="video-container mb-4">
                            <iframe id="frame-video" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>

                        <div class="task-box d-flex flex-column flex-md-row justify-content-between align-items-center">
                            <div class="mb-3 mb-md-0 text-center text-md-start">
                                <h6 class="fw-bold mb-1" style="color: var(--korisu-orange);">Tugas Kamu:</h6>
                                <p class="text-muted mb-0">Tonton video ini hingga selesai untuk memahami materi dengan utuh.</p>
                            </div>
                            <button id="btn-tandai" class="btn btn-selesai-modern" onclick="tandaiSelesai()">Tandai Selesai & Ambil EXP ✔️</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal Sukses Animasi Lembut -->
    <div class="modal fade" id="modalSukses" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-modern">
                <div class="modal-body text-center p-5">
                    <h1 class="mb-3" style="font-size: 4rem;">🎉</h1>
                    <h3 class="fw-bold mb-2 text-dark">Materi Selesai!</h3>
                    <div class="bg-light border border-success rounded-4 p-3 mx-auto mb-4" style="max-width: 250px;">
                        <h5 class="text-success fw-bold mb-0" id="teks-exp">+10 EXP Didapatkan</h5>
                    </div>
                    <button type="button" class="btn-korisu-solid w-100 fs-5" onclick="window.location.href='kelas.html'">Kembali ke Kurikulum</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika Dipertahankan Utuh -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        let USER = JSON.parse(localStorage.getItem('korisu_user') || '{}');
        
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        if (!TOKEN) window.location.href = "auth.html";
        if (!lessonId) window.location.href = "kelas.html";

        async function muatVideo() {
            try {
                const res = await fetch(`${API_URL}/lessons/${lessonId}`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();

                if (res.ok && data.lesson) {
                    document.getElementById('judul-materi').innerText = data.lesson.judul_materi;
                    document.getElementById('frame-video').src = data.lesson.konten_url;
                } else {
                    document.getElementById('judul-materi').innerText = "Materi tidak ditemukan.";
                    document.getElementById('btn-tandai').disabled = true;
                }
            } catch (error) {
                document.getElementById('judul-materi').innerHTML = "<span class='text-danger'>Gagal memuat video.</span>";
            }
        }

        async function tandaiSelesai() {
            const btn = document.getElementById('btn-tandai');
            btn.disabled = true;
            btn.innerText = "MENYIMPAN...";

            try {
                const res = await fetch(`${API_URL}/lessons/${lessonId}/complete`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();

                if (res.ok) {
                    USER.exp = (USER.exp || 0) + data.exp_didapat;
                    localStorage.setItem('korisu_user', JSON.stringify(USER));

                    document.getElementById('teks-exp').innerText = `+${data.exp_didapat} EXP Didapatkan 🐿️`;
                    const myModal = new bootstrap.Modal(document.getElementById('modalSukses'));
                    myModal.show();
                } else {
                    alert(data.message);
                    btn.disabled = false;
                    btn.innerText = "Tandai Selesai & Ambil EXP ✔️";
                }
            } catch (error) {
                alert("Gagal menghubungi server.");
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', muatVideo);
    </script>
</body>
</html>
