<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Materi - KORISU Gakkou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --korisu-orange: #fd7e14;
            --korisu-black: #212529;
            --korisu-white: #ffffff;
        }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .navbar-korisu { background-color: var(--korisu-orange); border-bottom: 3px solid var(--korisu-black); }
        .card-custom {
            background-color: var(--korisu-white);
            border: 2px solid var(--korisu-black);
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--korisu-black);
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid var(--korisu-black);
            background-color: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .btn-korisu { background-color: var(--korisu-black); color: white; border: 2px solid var(--korisu-black); font-weight: bold; }
        .btn-korisu:hover { background-color: var(--korisu-orange); color: var(--korisu-black); }
        .btn-selesai { background-color: #198754; color: white; border: 2px solid var(--korisu-black); font-weight: bold; }
        .btn-selesai:hover { background-color: #146c43; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-korisu shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="kelas.html">🔙 Kembali ke Kurikulum</a>
            <span class="text-white fw-bold d-none d-md-block">📺 Ruang Putar KORISU Gakkou</span>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card card-custom p-3 p-md-4">
                    
                    <h3 class="fw-bold mb-3" id="judul-materi">Memuat Video...</h3>
                    
                    <div class="video-container mb-4">
                        <iframe id="frame-video" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>

                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center bg-light p-3 border border-dark rounded">
                        <div class="mb-3 mb-md-0 text-center text-md-start">
                            <h6 class="fw-bold mb-1">Tugas Kamu:</h6>
                            <small class="text-muted">Tonton video hingga selesai untuk memahami materi.</small>
                        </div>
                        <button id="btn-tandai" class="btn btn-selesai px-4 py-2" onclick="tandaiSelesai()">Tandai Selesai & Ambil EXP ✔️</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal Sukses -->
    <div class="modal fade" id="modalSukses" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border: 3px solid var(--korisu-black); border-radius: 15px;">
                <div class="modal-body text-center p-4">
                    <h1 class="mb-3">🎉</h1>
                    <h4 class="fw-bold mb-2">Materi Selesai!</h4>
                    <p class="text-success fw-bold mb-4" id="teks-exp">+10 EXP Didapatkan</p>
                    <button type="button" class="btn btn-korisu w-100" onclick="window.location.href='kelas.html'">Kembali ke Kurikulum</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://korisugakkou-api.onrender.com/api';
        const TOKEN = localStorage.getItem('korisu_token');
        let USER = JSON.parse(localStorage.getItem('korisu_user') || '{}');
        
        // Mengambil ID dari URL (Contoh: video-player.html?id=2)
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        if (!TOKEN) window.location.href = "auth.html";
        if (!lessonId) window.location.href = "kelas.html";

        async function muatVideo() {
            try {
                const res = await fetch(`${API_URL}/lessons/${lessonId}`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();

                if (res.ok && data.lesson) {
                    document.getElementById('judul-materi').innerText = data.lesson.judul_materi;
                    document.getElementById('frame-video').src = data.lesson.konten_url;
                } else {
                    document.getElementById('judul-materi').innerText = "Materi tidak ditemukan.";
                    document.getElementById('btn-tandai').disabled = true;
                }
            } catch (error) {
                document.getElementById('judul-materi').innerHTML = "<span class='text-danger'>Gagal memuat video.</span>";
            }
        }

        async function tandaiSelesai() {
            const btn = document.getElementById('btn-tandai');
            btn.disabled = true;
            btn.innerText = "MENYIMPAN...";

            try {
                const res = await fetch(`${API_URL}/lessons/${lessonId}/complete`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });
                const data = await res.json();

                if (res.ok) {
                    // Update EXP di memori browser
                    USER.exp = (USER.exp || 0) + data.exp_didapat;
                    localStorage.setItem('korisu_user', JSON.stringify(USER));

                    document.getElementById('teks-exp').innerText = `+${data.exp_didapat} EXP Didapatkan 🐿️`;
                    const myModal = new bootstrap.Modal(document.getElementById('modalSukses'));
                    myModal.show();
                } else {
                    alert(data.message);
                    btn.disabled = false;
                    btn.innerText = "Tandai Selesai & Ambil EXP ✔️";
                }
            } catch (error) {
                alert("Gagal menghubungi server.");
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', muatVideo);
    </script>
</body>
</html>
